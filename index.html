<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>Stickman Rivals — 3D Combat Prototype</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#9fd0ef;font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;touch-action:none;overscroll-behavior:none}
  #game-canvas{position:fixed;inset:0;display:block}
  /* Rotate hint */
  #rotate-hint{display:none;position:fixed;inset:0;z-index:200;background:rgba(10,15,25,.92);color:#fff;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-size:18px;text-align:center;padding:20px}
  @media (orientation:portrait) and (max-width:700px){
    #rotate-hint{display:flex}
  }
  /* Reticle — single minimal white dot (position set by aiming mode) */
  #reticle{position:fixed;left:58%;top:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:20}
  #aim-dot{width:8px;height:8px;background:#fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.55),0 0 5px rgba(0,0,0,.5);transition:transform .08s ease,background .08s ease}
  #reticle.hit #aim-dot{transform:scale(2.1);background:#ffd23f}
  /* Hitmarker — brief X flash at the reticle on confirmed hits (never blocks view) */
  #hitmarker{position:fixed;left:58%;top:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:20;opacity:0;width:26px;height:26px}
  #hitmarker i{position:absolute;left:50%;top:50%;width:9px;height:2px;background:#fff;box-shadow:0 0 4px rgba(0,0,0,.8)}
  #hitmarker i:nth-child(1){transform:translate(-130%,-130%) rotate(45deg)}
  #hitmarker i:nth-child(2){transform:translate(30%,-130%) rotate(-45deg)}
  #hitmarker i:nth-child(3){transform:translate(-130%,30%) rotate(-45deg)}
  #hitmarker i:nth-child(4){transform:translate(30%,30%) rotate(45deg)}
  #hitmarker.show{opacity:1}
  #hitmarker.kill i{background:#ff5252;height:3px}
  /* Aim lock marker — four clean white corners only, no center dot */
  #lock-marker{position:fixed;left:0;top:0;width:84px;height:84px;margin:-42px 0 0 -42px;pointer-events:none;z-index:21;display:none;transition:opacity .15s}
  .lock-corner{position:absolute;width:20px;height:20px;border:2px solid rgba(255,255,255,.95);filter:drop-shadow(0 1px 2px rgba(0,0,0,.8))}
  .lc-tl{left:0;top:0;border-right:none;border-bottom:none;border-radius:6px 0 0 0}
  .lc-tr{right:0;top:0;border-left:none;border-bottom:none;border-radius:0 6px 0 0}
  .lc-bl{left:0;bottom:0;border-right:none;border-top:none;border-radius:0 0 0 6px}
  .lc-br{right:0;bottom:0;border-left:none;border-top:none;border-radius:0 0 6px 0}
  /* Top bar */
  #topbar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:center;align-items:center;padding:10px;z-index:30;pointer-events:none}
  #kill-counter{background:rgba(0,0,0,.45);color:#fff;padding:6px 16px;border-radius:20px;font-weight:700;font-size:14px;letter-spacing:.5px;backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.2)}
  #settings-btn{position:fixed;top:10px;right:12px;z-index:40;width:48px;height:48px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(15,20,30,.65);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(6px);transition:transform .12s}
  #settings-btn:active{transform:scale(1.15)}
  #fs-btn{position:fixed;top:10px;left:12px;z-index:40;height:40px;padding:0 14px;border-radius:20px;border:1px solid rgba(255,255,255,.5);background:rgba(15,20,30,.55);color:#fff;font-size:13px;font-weight:700;cursor:pointer}
  /* Joystick */
  #joystick{position:fixed;left:22px;bottom:22px;width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.45);z-index:30;backdrop-filter:blur(3px);touch-action:none}
  #joy-knob{position:absolute;left:50%;top:50%;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(0,0,0,.35);transform:translate(-50%,-50%);transition:transform .05s linear}
  /* Combat cluster — premium dark-metal HUD, Marvel-Rivals clarity */
  #combat-cluster{position:fixed;right:12px;bottom:12px;width:260px;height:230px;z-index:30;pointer-events:none;--gold:#ffd23f}
  .abtn{position:absolute;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:800;cursor:pointer;pointer-events:auto;overflow:hidden;touch-action:none;
    background:linear-gradient(160deg,#2b3038 0%,#171a1f 55%,#0e1114 100%);
    border:2px solid #454c56;color:#dfe3e8;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -3px 6px rgba(0,0,0,.5),0 4px 14px rgba(0,0,0,.45);
    transition:transform .1s ease,box-shadow .15s ease,border-color .15s ease,filter .15s ease}
  .abtn svg{display:block;pointer-events:none}
  .abtn .blabel{font-size:8px;font-weight:800;letter-spacing:1.4px;color:#9aa1ab;pointer-events:none;line-height:1}
  .abtn.pressed{transform:scale(.9)!important;filter:brightness(1.35)}
  .abtn.fired{border-color:var(--gold);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 12px rgba(255,210,63,.55)}
  .abtn.ready-pop{animation:readypop .28s ease}
  @keyframes readypop{0%{box-shadow:0 0 0 0 rgba(255,210,63,.7)}100%{box-shadow:0 0 0 10px rgba(255,210,63,0)}}
  .abtn .cd-overlay{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;pointer-events:none;
    background:conic-gradient(rgba(4,6,9,.82) calc(var(--cd,0)*1turn), rgba(4,6,9,.12) 0)}
  .abtn .cd-text{font-size:13px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000;display:none}
  .abtn.on-cd .cd-text{display:block}
  .abtn.on-cd{filter:saturate(.6) brightness(.85)}
  .abtn.ability-active{border-color:var(--acc,#ffe14d);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 0 0 2px var(--acc,#ffe14d),0 0 14px var(--acc,#ffe14d)}
  .abtn.ability-active .blabel{color:var(--acc,#ffe14d)}
  .abtn.disabled{opacity:.42;filter:grayscale(.75)}
  #btn-attack{left:148px;top:118px;width:108px;height:108px;border-color:#6b5a17;color:var(--gold)}
  #btn-attack svg{width:34px;height:34px}
  #btn-attack .blabel{color:var(--gold);font-size:9px}
  #btn-attack .pips{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none}
  #btn-attack .pips i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.22);border:1px solid rgba(255,210,63,.5)}
  #btn-attack .pips i.on{background:var(--gold);box-shadow:0 0 6px rgba(255,210,63,.9)}
  #btn-attack .pips i.big{width:9px;height:9px}
  #btn-attack{box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -4px 8px rgba(0,0,0,.55),0 0 0 1px #000,0 4px 16px rgba(0,0,0,.5)}
  .ability{--acc:#8b93a1;width:60px;height:60px}
  .ability svg{width:24px;height:24px}
  #ab1{--acc:#7cc4ff;left:72px;top:142px}
  #ab2{--acc:#f0a35e;left:92px;top:82px}
  #ab3{--acc:#ff7a7a;left:144px;top:46px}
  #ab4{--acc:#9fe870;left:204px;top:47px}
  .ability .blabel{color:var(--acc)}
  /* Damage numbers + healthbars handled in 3D + HTML */
  #dmg-layer{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}
  .dmg-num{position:absolute;font-weight:900;font-size:22px;color:#ffeb3b;text-shadow:0 0 6px #ff5722,0 2px 2px #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;transform:translate(-50%,-50%);will-change:transform,opacity;white-space:nowrap}
  .dmg-num.crit{color:#ff5252;font-size:27px}
  /* Settings panel — compact dark charcoal, pro game UI */
  #settings-panel{position:fixed;top:64px;right:10px;width:min(300px,92vw);max-height:82vh;overflow-y:auto;background:#1c1e22;color:#d7dae0;border:1px solid #34373e;border-radius:10px;padding:12px 12px 10px;z-index:60;display:none;box-shadow:0 12px 32px rgba(0,0,0,.55)}
  #settings-panel.open{display:block}
  #settings-panel h2{font-size:12px;font-weight:700;margin:0 0 4px;text-align:left;letter-spacing:1.2px;text-transform:uppercase;color:#9aa0aa}
  .srow{margin:0;padding:9px 2px;border-bottom:1px solid #2a2d33}
  .srow:last-of-type{border-bottom:none}
  .srow label{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:600;margin-bottom:6px;color:#cfd3da}
  .srow label span.val{color:#e8eaee;font-weight:700;font-size:12px}
  input[type=range]{width:100%;accent-color:#9aa3af;height:22px}
  .toggle-row{display:flex;justify-content:space-between;align-items:center}
  .toggle{width:40px;height:22px;border-radius:11px;background:#3a3d44;position:relative;cursor:pointer;transition:background .18s;flex-shrink:0;border:1px solid #4a4e57}
  .toggle.on{background:#6f8200;border-color:#6f8200}
  .toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:left .18s}
  .toggle.on::after{left:20px}
  .qbtns{display:flex;gap:6px}
  .qbtns button{flex:1;padding:7px 0;border-radius:6px;border:1px solid #3a3d44;background:#24262c;color:#cfd3da;font-weight:700;font-size:12px;cursor:pointer;transition:background .15s}
  .qbtns button.active{background:#33363d;border-color:#6f8200;color:#fff}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;padding:7px 4px;border-radius:6px;border:1px solid #3a3d44;background:#24262c;color:#cfd3da;font-weight:700;font-size:11.5px;cursor:pointer}
  .seg button.active{background:#33363d;border-color:#6f8200;color:#fff}
  #reset-sens{width:100%;margin-top:6px;padding:7px;border-radius:6px;border:1px solid #3a3d44;background:#24262c;color:#cfd3da;font-weight:700;font-size:12px;cursor:pointer}
  #close-settings{width:100%;margin:8px 0 2px;padding:9px;border-radius:6px;border:none;background:#e8eaee;color:#1c1e22;font-weight:800;cursor:pointer;font-size:13px}
  #toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;padding:10px 18px;border-radius:24px;font-weight:800;z-index:70;display:none;font-size:15px}
  #hit-vignette{position:fixed;inset:0;pointer-events:none;z-index:15;background:radial-gradient(ellipse at center,transparent 62%,rgba(255,30,30,.35) 100%);opacity:0;transition:opacity .15s}
  #power-flash{position:fixed;inset:0;pointer-events:none;z-index:14;opacity:0}
  /* Character select */
  #char-btn{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:40;height:40px;padding:0 16px;border-radius:20px;border:1px solid rgba(255,255,255,.5);background:rgba(15,20,30,.55);color:#fff;font-size:12px;font-weight:800;letter-spacing:1px;cursor:pointer}
  #char-panel{position:fixed;top:60px;left:50%;transform:translateX(-50%);width:min(280px,90vw);background:#1c1e22;color:#d7dae0;border:1px solid #34373e;border-radius:10px;padding:14px;z-index:65;display:none;box-shadow:0 12px 32px rgba(0,0,0,.55);text-align:center}
  #char-panel.open{display:block}
  #char-panel h3{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:#9aa0aa;margin-bottom:10px}
  #char-preview{display:flex;justify-content:center;margin-bottom:8px}
  #char-name{font-size:16px;font-weight:800;letter-spacing:2px;color:#fff;margin-bottom:2px}
  #char-desc{font-size:11.5px;color:#9aa0aa;margin-bottom:10px}
  #char-select{width:100%;padding:9px;border-radius:6px;border:none;background:#e8eaee;color:#1c1e22;font-weight:800;font-size:13px;cursor:pointer}
  #char-select.selected{background:#6f8200;color:#fff}
  /* Flight altitude buttons (visible only while flying) */
  #fly-alt{position:fixed;left:170px;bottom:30px;z-index:31;display:none;flex-direction:column;gap:10px}
  #fly-alt.show{display:flex}
  #fly-alt button{width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,.85);background:rgba(20,24,32,.7);color:#fff;font-size:20px;font-weight:800;touch-action:none}
  /* Active ability state (legacy hook, superseded by per-button --acc above) */
  .abtn.ability-active{border-color:var(--acc,#ffe14d)}
</style>

<body>
<canvas id="game-canvas"></canvas>
<div id="hit-vignette"></div>
<div id="power-flash"></div>
<div id="reticle"><div id="aim-dot"></div></div>
<div id="hitmarker"><i></i><i></i><i></i><i></i></div>
<div id="lock-marker"><div class="lock-corner lc-tl"></div><div class="lock-corner lc-tr"></div><div class="lock-corner lc-bl"></div><div class="lock-corner lc-br"></div></div>
<div id="dmg-layer"></div>
<div id="topbar"><div id="kill-counter">TARGETS: 3</div></div>
<button id="fs-btn">⛶ FULLSCREEN</button>
<button id="char-btn" title="Character">◉ CHARACTER</button>
<div id="settings-btn" title="Settings">⚙</div>
<div id="joystick"><div id="joy-knob"></div></div>
<div id="fly-alt"><button id="fly-up" title="Ascend">▲</button><button id="fly-down" title="Descend">▼</button></div>
<div id="combat-cluster">
  <div id="ab4" class="abtn ability" title="Flight"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 13.5-7-2.8-7 2.8L12 3z"/><path d="M12 3v7"/><path d="M4.5 18.5L3 21M19.5 18.5L21 21"/></svg><span class="blabel">FLY</span><div class="cd-overlay"><span class="cd-text"></span></div></div>
  <div id="ab3" class="abtn ability" title="Dual-Hand Laser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5l8.5 4M3 17.5l8.5-4M11.5 10.5H20"/><circle cx="20.5" cy="10.5" r="1.5" fill="currentColor" stroke="none"/></svg><span class="blabel">BEAM</span><div class="cd-overlay"><span class="cd-text"></span></div></div>
  <div id="ab2" class="abtn ability" title="Missile Volley"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 19V10M6 10l-2 2M6 10l2 2M12 21V6M12 6l-2.4 2.4M12 6l2.4 2.4M18 19v-9M18 10l-2 2M18 10l2 2"/></svg><span class="blabel">VOLLEY</span><div class="cd-overlay"><span class="cd-text"></span></div></div>
  <div id="ab1" class="abtn ability" title="Repulsor Spin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M17.5 2.8v3.6h-3.6"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg><span class="blabel">SPIN</span><div class="cd-overlay"><span class="cd-text"></span></div></div>
  <div id="btn-attack" class="abtn" title="Fire missile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.1"/><path d="M12 2.5v3.2M12 18.3v3.2M2.5 12h3.2M18.3 12h3.2M5.3 5.3l2.2 2.2M16.5 16.5l2.2 2.2M18.7 5.3l-2.2 2.2M7.5 16.5l-2.2 2.2"/></svg><span class="blabel">ATTACK</span><span class="pips"><i></i><i></i><i></i></span><div class="cd-overlay"><span class="cd-text"></span></div></div>
</div>
<div id="char-panel">
  <h3>Character Select</h3>
  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px">
    <button id="char-prev" style="width:34px;height:34px;border-radius:50%;border:1px solid #4a4e57;background:#24262c;color:#fff;font-weight:900;cursor:pointer">◀</button>
    <div id="char-preview"><svg width="70" height="110" viewBox="0 0 70 110"><g stroke="#e8eaee" stroke-width="5" stroke-linecap="round" fill="none"><circle cx="35" cy="14" r="10" fill="#e8eaee" stroke="none"/><line x1="35" y1="26" x2="35" y2="62"/><line x1="35" y1="34" x2="16" y2="48"/><line x1="35" y1="34" x2="54" y2="48"/><line x1="35" y1="62" x2="22" y2="100"/><line x1="35" y1="62" x2="48" y2="100"/></g></svg></div>

</div>
<div id="rotate-hint"><div style="font-size:44px">🔄</div><div>Rotate to <b>landscape</b> for best experience</div><button id="fs-btn2" style="padding:12px 26px;border-radius:24px;border:none;background:#7CB342;font-weight:900">TAP FOR FULLSCREEN</button></div>

  <h2>Settings</h2>
  <div class="srow"><label><span>◎ Target count</span><span class="val" id="v-targets">3</span></label><input id="s-targets" type="range" min="1" max="8" step="1" value="3"></div>

<script type="module">
import * as THREE from 'three';

/* ============ SETTINGS STATE ============ */
const Settings = { targetCount:3, aimAssist:true, aimingMode:'right', sensitivity:1.2, volume:0.7, shake:true, quality:'medium', character:'ironman', rigType:'r15' };
try{ const sr=localStorage.getItem('stickman-rig'); if(sr==='r6'||sr==='r15') Settings.rigType=sr; }catch(e){}
const DEFAULT_SENS = 1.2;
// Central graphics-quality controller: every visual system reads from Q().
const QUALITY = {
  low:{ pixelRatio:1, particles:8, trail:8, shadow:false, shadowSize:512, blob:0.34,
        trailRate:0.25, boomScale:0.8, smokeRate:0.2, beamWidth:0.7, thrustRate:0.3, flashLight:false, boomLight:false },
  medium:{ pixelRatio:Math.min(devicePixelRatio,1.5), particles:20, trail:22, shadow:true, shadowSize:1024, blob:0.27,
        trailRate:0.55, boomScale:1.0, smokeRate:0.5, beamWidth:1.0, thrustRate:0.6, flashLight:true, boomLight:true },
  high:{ pixelRatio:Math.min(devicePixelRatio,2), particles:42, trail:40, shadow:true, shadowSize:2048, blob:0.22,
        trailRate:0.85, boomScale:1.25, smokeRate:0.9, beamWidth:1.3, thrustRate:1.0, flashLight:true, boomLight:true }
};
function Q(){ return QUALITY[Settings.quality]; }

/* ============ AUDIO (procedural WebAudio, mastered mix bus) ============
   Master chain: sources -> sfxGain -> duckGain -> compressor -> destination.
   The compressor is the safety limiter (prevents clipping when volleys, spin
   zaps and explosions overlap); duckGain carries transient ducking (sustained
   laser/flight hums sit in the mix) and hit-stop dilation (world slows, mix
   tightens momentarily so impacts land harder). */
let audioCtx=null, masterGain=null, duckGain=null;
function ensureAudio(){
  if(audioCtx) return;
  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    masterGain=audioCtx.createGain(); masterGain.gain.value=Settings.volume;
    duckGain=audioCtx.createGain(); duckGain.gain.value=1;
    const comp=audioCtx.createDynamicsCompressor();
    comp.threshold.value=-9; comp.knee.value=16; comp.ratio.value=9; comp.attack.value=0.003; comp.release.value=0.16;
    masterGain.connect(duckGain); duckGain.connect(comp); comp.connect(audioCtx.destination);
  }catch(e){}
}
function setVolume(v){ Settings.volume=v; if(masterGain) masterGain.gain.value=v; }
// Transient duck for sustained layers: dip the bus briefly when a new bed starts.

// circle-vs-box push-out for the player (ground + low flight; flies over tall tops).
// STEP-UP: structures at or below STEP_UP are walkable footing — walking into
// one places the player on top instead of blocking, so the arena's platforms
// and crates are genuinely testable. Tall cover keeps blocking. Returns the
// height to stand on (0 = none); callers decide when to apply it.
const STEP_UP=1.25;
function collideObstacles(pos,flyH,stepUp){
  const bodyY=flyH+1.0;
  let step=0;
  for(const o of obstacles){
    if(!o.alive) continue;
    if(bodyY>o.top+0.4) continue; // cleared it vertically
    const dx=pos.x-o.cx, dz=pos.z-o.cz;
    const px=o.hw-Math.abs(dx), pz=o.hd-Math.abs(dz);
    if(px>0&&pz>0){
      if(stepUp && o.top<=STEP_UP && flyH<o.top){ if(o.top>step) step=o.top; continue; }
      if(px<pz) pos.x=o.cx+Math.sign(dx||1)*(o.hw);
      else pos.z=o.cz+Math.sign(dz||1)*(o.hd);
    }
  }
  return step;
}

const BURN = { tick:0.5, dur:2.5, maxDur:5.0, dmg:1.2 };
function applyBurn(t, opts={}){

  if(t.burn){

    t.burn.dmg=Math.max(t.burn.dmg,dmg);

/* ============ CROWD-CONTROL SYSTEM ============
   Three distinct CC effects, fully functional and integrated:
   1. RAGDOLL — physics-based tumble/throw, recovers naturally
   2. POWER_DISABLE — prevents ability use, movement allowed
   3. KNOCKBACK — directional force launch proportional to ability
   All effects have durations, recovery, and anti-stunlock protection. */
const CC = {
  ragdoll: { maxDur: 1.2, recoverDur: 0.4, immunityDur: 1.5 },
  powerDisable: { maxDur: 2.0, recoverDur: 0.3, immunityDur: 1.0 },
  knockback: { baseForce: 12, airMult: 1.5, groundMult: 0.8, maxVel: 35, recoverDur: 0.6 }
};
// Anti-stunlock: diminishing returns on repeated CC
const CC_IMMUNITY = { ragdoll: 'ccImmuneRagdoll', powerDisable: 'ccImmunePower', knockback: 'ccImmuneKB' };
function applyRagdoll(t, duration, sourcePos, forceDir=null){
  if(!t || !t.alive) return;
  if(t[CC_IMMUNITY.ragdoll] && t[CC_IMMUNITY.ragdoll] > performance.now()/1000) return; // immune
  const dur = Math.min(CC.ragdoll.maxDur, duration || 0.7);
  t.ragdollT = Math.max(t.ragdollT || 0, dur);
  t.ragdollRecoverT = CC.ragdoll.recoverDur;
  t.ragdollSource = sourcePos ? sourcePos.clone() : t.rig.group.position.clone();
  t.ragdollForceDir = forceDir;
  // Set immunity after this ragdoll ends
  t[CC_IMMUNITY.ragdoll] = performance.now()/1000 + dur + CC.ragdoll.immunityDur;
  // Visual: immediate physical reaction
  if(t.rig && t.rig.group){
    t.rig.group.rotation.z = THREE.MathUtils.clamp((Math.random()-0.5)*0.6, -0.6, 0.6);
    t.rig.group.rotation.x = -0.4;
  }
}
function applyPowerDisable(t, duration){
  if(!t || !t.alive) return;
  if(t[CC_IMMUNITY.powerDisable] && t[CC_IMMUNITY.powerDisable] > performance.now()/1000) return;
  const dur = Math.min(CC.powerDisable.maxDur, duration || 1.5);
  t.powerDisableT = Math.max(t.powerDisableT || 0, dur);
  t[CC_IMMUNITY.powerDisable] = performance.now()/1000 + dur + CC.powerDisable.immunityDur;
  // Visual indicator: desaturate + pulse
  if(t.rig && t.rig.group){
    t.rig.group.traverse(o=>{
      if(o.isMesh && o.material && o.material.emissive!==undefined){
        o.material.emissive.setHex(0x442266);
        o.material.emissiveIntensity = 0.5;
      }
    });
  }
}
function applyKnockback(t, force, sourcePos, upward=0.3){
  if(!t || !t.alive) return;
  if(t[CC_IMMUNITY.knockback] && t[CC_IMMUNITY.knockback] > performance.now()/1000){
    // Diminished knockback during immunity
    force *= 0.3;
  }
  const dir = new THREE.Vector3();
  if(sourcePos){
    dir.copy(t.rig.group.position).sub(sourcePos);
    dir.y = 0;
    if(dir.lengthSq() < 0.01) dir.set(Math.random()-0.5, 0, Math.random()-0.5);
    dir.normalize();
  } else {
    dir.set(Math.random()-0.5, 0, Math.random()-0.5).normalize();
  }
  dir.y = upward;
  dir.normalize();
  const kbVel = dir.multiplyScalar(Math.min(force, CC.knockback.maxVel));
  if(!t.kbVel) t.kbVel = new THREE.Vector3();
  t.kbVel.add(kbVel);
  t.knockbackT = Math.max(t.knockbackT || 0, CC.knockback.recoverDur);
  t[CC_IMMUNITY.knockback] = performance.now()/1000 + CC.knockback.recoverDur + CC.knockback.immunityDur;
  // Trigger ragdoll on strong knockback
  if(force > CC.knockback.baseForce * 1.5){
    applyRagdoll(t, 0.5, sourcePos, dir);
  }
}
function updateCrowdControl(t, dt){
  if(!t || !t.alive) return;
  // Ragdoll recovery
  if(t.ragdollT > 0){
    t.ragdollT -= dt;
    if(t.ragdollT <= 0){
      t.ragdollT = 0;
      t.ragdollRecoverT = CC.ragdoll.recoverDur;
    }
  }
  if(t.ragdollRecoverT > 0){
    t.ragdollRecoverT -= dt;
    // Smooth recovery rotation
    if(t.rig && t.rig.group){
      t.rig.group.rotation.z = THREE.MathUtils.damp(t.rig.group.rotation.z, 0, 8, dt);
      t.rig.group.rotation.x = THREE.MathUtils.damp(t.rig.group.rotation.x, 0, 8, dt);
    }
  }
  // Power disable decay
  if(t.powerDisableT > 0){
    t.powerDisableT -= dt;
    if(t.powerDisableT <= 0){
      t.powerDisableT = 0;
      // Clear visual
      if(t.rig && t.rig.group){
        t.rig.group.traverse(o=>{
          if(o.isMesh && o.material && o.material.emissive!==undefined){
            o.material.emissive.setRGB(0,0,0);
            o.material.emissiveIntensity = 0;
          }
        });
      }
    }
  }
  // Knockback physics integration
  if(t.kbVel && t.kbVel.lengthSq() > 0.01){
    t.rig.group.position.addScaledVector(t.kbVel, dt);
    t.kbVel.multiplyScalar(1 - dt * 4); // Drag
    t.kbVel.y -= dt * 20; // Gravity
    if(t.rig.group.position.y < 0.5){
      t.rig.group.position.y = 0.5;
      t.kbVel.y = 0;
    }
    if(t.knockbackT > 0) t.knockbackT -= dt;
    if(t.kbVel.lengthSq() < 0.5) t.kbVel.set(0,0,0);
  }
}

/* ---- VERTICAL PHYSICS: gravity, jump, coyote, landing ----
   Shared by ground locomotion and flight: flight overrides gravity with its own
   climb integration, and releasing flight mid-air resumes falling naturally. */
const GRAVITY=22, JUMP_VEL=8.6, COYOTE=0.12;
let jumpPressed=false;
function tryJump(){
  if(player.flying){ // flight already owns vertical movement; drop altitude instead
    return;
  }
  if(player.atkT>0||AB.spin.t>0||(AB.flame&&AB.flame.t>0)) return; // no jump mid-attack/spin/flame: keeps commitments clean
  if(player.coyoteT>0){
    player.vy=JUMP_VEL; player.grounded=false; player.coyoteT=0; player.jumpT=0.28; player.airT=0;
    SFX.jump(); triggerShake(0.05,0.1); camKick(0.05);
  }
}
function updatePlayerPhysics(dt){
  if(player.flying){
    // flight height integration lives in updateFlight(); keep ground state parked
    player.grounded=false; player.vy=0; player.coyoteT=0; return;
  }
  if(player.grounded){
    player.coyoteT=COYOTE;
    player.jumpT=Math.max(0,player.jumpT-dt);
    player.landT=Math.max(0,player.landT-dt*1.6);
    // stick to standable tops (platform / cover); walking off an edge starts a fall below
    player.flyH=groundHeightAt(player.pos.x,player.pos.z);
    return;
  }
  // airborne: integrate gravity with a short apex hang for weight.
  // Flight-touchdown glide owns vertical while active (no double integration).
  if(player.landing) return;
  player.airT+=dt;
  player.jumpT=Math.max(0,player.jumpT-dt);
  const hang=Math.abs(player.vy)<2.2?0.72:1; // reduced gravity near apex
  player.vy-=GRAVITY*hang*dt;
  player.flyH+=player.vy*dt;
  player.lastFallSpeed=Math.max(player.lastFallSpeed,-player.vy);
  const gnd=groundHeightAt(player.pos.x,player.pos.z);
  if(player.flyH<=gnd){
    player.flyH=gnd; player.vy=0; player.grounded=true;
    const hard=player.lastFallSpeed>9;
    player.landT=hard?1:0.55;
    player.lastFallSpeed=0;
    SFX.land(hard);
    triggerShake(hard?0.22:0.08,hard?0.22:0.12);
    camKick(hard?0.1:0.04);
    landingDust();
  }
  player.coyoteT=Math.max(0,player.coyoteT-dt);
}
function landingDust(){
  const q=Q(); if(Settings.quality==='low') return;
  const entry={flash:null,parts:[],ringM:null,life:0,dur:0.45};

// Precise world-space point indicated by the camera ray through the aim dot:
// nearest target hit, else ground-plane hit, else far point along the ray.
function computeAimPoint(maxDist=90){
  const ray=aimRay();
  let bestT=maxDist, bestPoint=null;
  for(const t of targets){ if(!t.alive) continue;
    const c=t.rig.group.position.clone(); c.y=1.3;
    const toC=c.clone().sub(ray.origin); const tProj=toC.dot(ray.direction);
    if(tProj<1||tProj>maxDist) continue;
    const closest=ray.origin.clone().addScaledVector(ray.direction,tProj);
    if(closest.distanceTo(c)<1.0 && tProj<bestT){ bestT=tProj; bestPoint=closest; }
  }
  if(bestPoint) return bestPoint;
  if(ray.intersectPlane(groundPlane,_hitP) && ray.origin.distanceTo(_hitP)<maxDist) return _hitP.clone();
  return ray.origin.clone().addScaledVector(ray.direction,maxDist);
}

/* Transient FX mesh pool: recycles short-lived additive/transparent spheres
   (smoke, sparks, thrust, palm parts) instead of allocating materials + meshes
   every frame. Quality caps total live pooled meshes; acquire fails past cap. */
function fxSpawn(geo,color,additive,op){
  for(const m of fxPool){
    if(!m.visible && m.userData.geo===geo && m.userData.color===color && m.userData.add===additive){
      m.visible=true; fxAlive++;
      m.material.opacity=op; m.scale.set(1,1,1); m.rotation.set(0,0,0);
      return m;
    }
  }
  if(fxAlive>=FXCAP[Settings.quality]) return null;
  const mat=new THREE.MeshBasicMaterial({color,transparent:true,opacity:op,
    blending:additive?THREE.AdditiveBlending:THREE.NormalBlending,depthWrite:false});
  const m=new THREE.Mesh(geo,mat);
  m.userData={geo,color,add:additive,pooled:true}; m.visible=true;
  scene.add(m); fxPool.push(m); fxAlive++;

}
function fxKill(m){ if(!m||!m.visible) return; m.visible=false; fxAlive=Math.max(0,fxAlive-1); }
/* Owned-transient disposal: explosion flashes/rings built with per-blast `new`
   geometry/material are disposed on cleanup so long sessions never leak GPU

   disposed — only hidden or removed. */
const SHARED_GEO = new Set();

function markSharedMat(...mats){ for(const m of mats) if(m) SHARED_MAT.add(m); }
function fxFree(m){
  if(!m) return;
  if(m.userData&&m.userData.pooled){ fxKill(m); return; }
  scene.remove(m);
  try{ if(m.material&&!SHARED_MAT.has(m.material)&&m.material.dispose) m.material.dispose(); }catch(e){}
  try{ if(m.geometry&&!SHARED_GEO.has(m.geometry)&&m.geometry.dispose) m.geometry.dispose(); }catch(e){}
}

function freeShotGroup(g){
  if(!g) return;

      if(o&&o.isMesh&&o.material&&!SHARED_MAT.has(o.material)&&o.material.dispose){
        try{ o.material.dispose(); }catch(e){}

/* ---- SWEPT projectile hit test: segment p0→p1 vs target torso sphere.
   The old per-point test can TUNNEL on mobile: a missile at 34 m/s travels
   1.13 m per frame at 30fps, wider than the 1.05 m torso radius, so fast
   projectiles could pass through a dummy on a slow device (and the player
   would see the explosion past the target). Testing the whole swept segment
   makes hit registration accurate and framerate-independent, while returning
   a single target keeps the "no duplicate hit registration" rule. */
const TGT_R = 1.05, TGT_CY = 1.2;
const _segDir = new THREE.Vector3();
function missileHitsTarget(p0, p1){
  const q1 = (p1===p0 || !p1) ? p0 : p1;
  _segDir.copy(q1).sub(p0);
  const L = _segDir.length();
  const px=p0.x, py=p0.y, pz=p0.z;
  if(L < 1e-6){ // zero-length step (paused frame): point test
    for(const t of targets){ if(!t.alive) continue;
      const tp=t.rig.group.position; const dx=px-tp.x, dz=pz-tp.z;
      if(dx*dx+dz*dz<TGT_R*TGT_R && Math.abs(py-(tp.y+TGT_CY))<1.7) return t;
    }
    return null;
  }
  const ux=_segDir.x/L, uy=_segDir.y/L, uz=_segDir.z/L;
  for(const t of targets){ if(!t.alive) continue;
    const tp=t.rig.group.position;
    const ox=tp.x-px, oy=tp.y+TGT_CY-py, oz=tp.z-pz;   // p0 -> torso centre
    const tca=ox*ux+oy*uy+oz*uz;                        // nearest param on segment
    if(tca < -0.8 || tca > L+0.8) continue;
    let k=tca; if(k<0) k=0; else if(k>L) k=L;
    const dx=ux*k-ox, dy=uy*k-oy, dz=uz*k-oz;
    if(dx*dx+dy*dy+dz*dz <= TGT_R*TGT_R) return t;
  }
  return null;
}
/* ---- Predictive homing steer ---- Marvel Rivals projectiles converge instead
   of tailing: aim at where the target WILL be (position + velocity × time of
   arrival) rather than where it is now. Without this, a homing missile always
   approaches from behind a moving target and its turn arc never closes. The
   lead is clamped so homing stays readable. Target velocity is tracked in
   animateTargets (t.vel). */
const _leadP = new THREE.Vector3();
function homingSteerDT(p, dt, agility){
  if(!p.target || !p.target.alive || !Settings.aimAssist) return;
  const pos = p.mesh ? p.mesh.position : p.group.position;
  const tp = p.target.rig.group.position.clone(); tp.y = 1.35;
  const spd = Math.max(1, p.vel.length());
  const eta = Math.min(0.35, pos.distanceTo(tp)/spd);   // capped intercept lead
  if(p.target.vel) tp.addScaledVector(p.target.vel, eta);
  const desired = tp.sub(pos).normalize().multiplyScalar(spd);
  p.vel.lerp(desired, Math.min(1, dt*agility));
}

  explosions.push({flash,parts,ringM,life:0,dur:0.5});

// Phoenix fireball trail ember spawn helper
function spawnPhoenixTrailEmbeders(mesh, trailMeshes, q){
  if(Math.random()<q.trailRate+0.15){
    const ember=fxSpawn(fireEmberGeo,Math.random()<0.5?0xff8a2a:0xffd24a,true,0.85);

    if(Math.random()<0.3){
      const sm=fxSpawn(smokeGeo,0x555555,false,0.4);
      if(sm){ sm.position.copy(mesh.position); sm.scale.setScalar(0.7); trailMeshes.push({m:sm,life:0,ember:false}); }
    }
  }
  while(trailMeshes.length>q.trail){ const old=trailMeshes.shift(); fxKill(old.m); }
}
function updateFireballs(dt){
  const q=Q();
  const _prev=new THREE.Vector3();
  for(let i=fireballs.length-1;i>=0;i--){ const p=fireballs[i];
    if(p.target && p.target.alive && Settings.aimAssist && !p.hostile) homingSteerDT(p,dt,8);
    _prev.copy(p.mesh.position);
    const step=p.vel.clone().multiplyScalar(dt);
    p.mesh.position.add(step); p.traveled+=step.length(); p.life+=dt;
    // Animated core and aura (basic fireballs carry core+glow, phoenix carry core+aura)
    const fl=0.9+Math.random()*0.5;
    if(p.core) p.core.scale.setScalar((p.big?1.45:1.0)*fl);
    if(p.aura) p.aura.scale.setScalar((p.big?1.45:1.0)*(1.1-Math.random()*0.25));
    if(p.glow && !p.aura) p.glow.scale.setScalar((p.big?1.0:1.0)*(1.05-Math.random()*0.2));
    // bright flame trail: embers + occasional smoke, quality-scaled
    spawnPhoenixTrailEmbeders(p.mesh, p.trailMeshes, q);
    for(let j=p.trailMeshes.length-1;j>=0;j--){ const tr=p.trailMeshes[j]; tr.life+=dt;
      tr.m.material.opacity=Math.max(0,(tr.ember?0.85:0.4)-tr.life*(tr.ember?2.2:1.4));
      tr.m.scale.multiplyScalar(1+dt*(tr.ember?0.8:1.6));
      if(tr.life>(tr.ember?0.4:0.5)){ fxKill(tr.m); p.trailMeshes.splice(j,1); } }
    const mp=p.mesh.position;
    if(p.hostile){
      // RIVAL fire: threatens the player only (same damage + burn as the player kit)
      const hitP=missileHitsPlayer(_prev,mp);
      const hitWallH=Math.abs(mp.x)>PLAY_HALF+0.4||Math.abs(mp.z)>PLAY_HALF+0.4;
      const hitCoverH=!hitP && pointInObstacles(mp);
      if(hitP){ fireballExplode(mp.clone(),0,p.radius,p.big,0,0); applyDamageToPlayer(p.dmg,mp.clone(),0.9); applyPlayerBurn({dmg:p.burnDmg,dur:p.burnDur}); destroyFireball(i); }
      else if(hitCoverH){ fireballExplode(mp.clone(),0,p.radius,p.big,0,0); if(mp.y<3){ const c=playerChest(new THREE.Vector3()); if(c.distanceTo(mp)<=p.radius+0.6){ applyDamageToPlayer(Math.max(1,Math.round(p.dmg*0.6)),mp.clone(),0.7); applyPlayerBurn({dmg:p.burnDmg,dur:p.burnDur}); } } destroyFireball(i); }
      else if(!hitP && (mp.y<0.12||hitWallH||mp.y>40)){ fireballExplode(mp.clone(),0,p.radius,false,0,0); destroyFireball(i); }
      else if(p.traveled>p.maxRange||p.life>4){ fireballExplode(mp.clone(),0,p.radius,false,0,0); destroyFireball(i); }
      continue;
    }
    const hit=missileHitsTarget(_prev,mp);
    const hitWall=Math.abs(mp.x)>PLAY_HALF+0.4||Math.abs(mp.z)>PLAY_HALF+0.4;
    const hitCover=!hit && pointInObstacles(mp);
    if(hit){ fireballExplode(mp.clone(),p.dmg,p.radius,p.big,p.burnDmg,p.burnDur); destroyFireball(i); }
    else if(hitCover){ fireballExplode(mp.clone(),p.dmg,p.radius,p.big,p.burnDmg,p.burnDur); destroyFireball(i); }
    else if(!hit && (mp.y<0.12||hitWall||mp.y>40)){ fireballExplode(mp.clone(),0,p.radius,false,0,0); destroyFireball(i); }
    else if(p.traveled>p.maxRange||p.life>4){ fireballExplode(mp.clone(),0,p.radius,false,0,0); destroyFireball(i); }
  }
}
// --- Phoenix Charge Bar System ---
let phoenixChargeBar = null;
let phoenixChargeBarGlow = null;
let phoenixChargeSound = null;
let phoenixFuryAura = null;
let phoenixChargeLevel = 0;
let phoenixCharging = false;
let phoenixChargeStartTime = 0;
function startPhoenixChargeSound(){
  ensureAudio(); if(!audioCtx || phoenixChargeSound) return;
  try{
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='sawtooth'; o.frequency.value=200; g.gain.value=0.1;
    o.connect(g); g.connect(masterGain); o.start();
    phoenixChargeSound={o,g};
    duckBus(0.7,0.12);
  }catch(e){ phoenixChargeSound=null; }
}
function stopPhoenixChargeSound(){
  if(!phoenixChargeSound) return;
  try{
    const h=phoenixChargeSound; phoenixChargeSound=null;
    h.g.gain.setTargetAtTime(0.0001,audioCtx.currentTime,0.05);
    h.o.stop(audioCtx.currentTime+0.2);
  }catch(e){ phoenixChargeSound=null; }
}
const PHOENIX_CHARGE_MAX = 2.0; // seconds to max charge
const PHOENIX_CHARGE_MIN = 0.3; // minimum charge to trigger
function createPhoenixChargeBar(){
  if(phoenixChargeBar) return;
  const q=Q();
  const barGeo = new THREE.PlaneGeometry(0.8, 2.2 * PHOENIX_CHARGE_MAX);
  const barMat = new THREE.MeshBasicMaterial({ 
    color: 0xffa500, 
    transparent: true, 
    opacity: 0.9, 
    depthWrite: false,
    side: THREE.DoubleSide 
  });

  phoenixChargeBar.rotation.x = 0; // upright vertical bar, not horizontal
  phoenixChargeBar.position.set(player.pos.x, player.flyH + 2.5, player.pos.z);
  phoenixChargeBar.visible = false;
  scene.add(phoenixChargeBar);
  // glow effect
  const glowGeo = new THREE.PlaneGeometry(1.0, 2.4 * PHOENIX_CHARGE_MAX);
  const glowMat = new THREE.MeshBasicMaterial({ 
    color: 0xffd76e, 
    transparent: true, 
    opacity: 0.4, 
    depthWrite: false,
    side: THREE.DoubleSide 
  });
  phoenixChargeBarGlow = new THREE.Mesh(glowGeo, glowMat);

function updatePhoenixChargeBar(dt){
  if(!phoenixChargeBar || !phoenixCharging) return;
  // Update bar position to follow player

  phoenixChargeBarGlow.position.copy(phoenixChargeBar.position);

  const chargePercent = Math.min(1, phoenixChargeLevel / PHOENIX_CHARGE_MAX);
  phoenixChargeBar.scale.y = 2.2 * chargePercent;
  phoenixChargeBarGlow.scale.y = 2.4 * chargePercent;

}
function destroyPhoenixChargeBar(){

    phoenixChargeBar = null;
  }

// --- Phoenix Burst: Chargeable Explosion ---
function startPhoenixBurstCharge(){
  ensureAudio(); if(!playerCanFight()) return;

function updatePhoenixCharge(dt){
  if(!phoenixCharging) return;
  const now = performance.now() / 1000;
  const held = now - phoenixChargeStartTime;
  phoenixChargeLevel = Math.min(PHOENIX_CHARGE_MAX, held);
  // Update charge bar
  updatePhoenixChargeBar(dt);
  // Intensify character's fiery aura and charge sound
  if(AB.flame){
    AB.flame.t = Math.max(0, AB.flame.t - dt);
  }
  // Charge sound pitch and volume rise with charge
  if(phoenixChargeSound){
    const t = phoenixChargeLevel / PHOENIX_CHARGE_MAX;
    try{ phoenixChargeSound.o.frequency.value = 200 + t * 800; }catch(e){}
    try{ phoenixChargeSound.g.gain.value = 0.1 + t * 0.4; }catch(e){}
  }
  // Automatic detonation at max charge
  if(phoenixChargeLevel >= PHOENIX_CHARGE_MAX){
    detonatePhoenixBurst();
    return;
  }
  // If player releases button, detonate at current charge
  // (handled by input binding)
}
function detonatePhoenixBurst(){
  if(!phoenixCharging) return;
  phoenixCharging = false;
  stopPhoenixChargeSound();
  const chargePercent = Math.min(1, phoenixChargeLevel / PHOENIX_CHARGE_MAX);
  // BALANCED: charged slam caps at 24 (never a one-shot); single damage path
  // via fireballExplode only (no stacked second hit).
  const radius = 3.0 + chargePercent * 4.0; // 3m to 7m radius
  const dmg = 10 + chargePercent * 14; // 10 to 24 damage
  const pos = player.pos.clone();
  pos.y = player.flyH + 1.0;
  // Hide charge bar immediately
  destroyPhoenixChargeBar();
  // Create visual explosion (single damage application inside)
  fireballExplode(pos, dmg, radius, chargePercent > 0.8, 1.2, 2.5);
  try{ AB.phBurst.cdMax=activeKit().abilities.burst.cd; AB.phBurst.cd=AB.phBurst.cdMax; }catch(e){ AB.phBurst.cd=9; }
  // Reset after brief delay
  setTimeout(()=>{ phoenixChargeLevel = 0; }, 100);
}

function updatePhoenixDive(dt){

  // --- ASCENT PHASE ---
  if(phoenixDiveDescentStartTime === null){
    // Progress through ascent
    const progress = THREE.MathUtils.clamp(diveTime / ascentTime, 0, 1);
    // Vertical motion: ease-out rise to peak height
    const height = maxHeight * (1 - Math.pow(1 - progress, 2));
    player.flyH = height;
    // Forward lean animation
    const leanProgress = THREE.MathUtils.clamp(progress, 0, 1);
    const targetLean = -forwardLean * progress; // lean forward as we rise
    // Apply lean to spine via animation controller dampening
    // (The animation controller will handle this via wFlame blend)
    // Rotate player slightly forward
    const forwardDir = new THREE.Vector3(Math.sin(-player.yaw), 0, Math.cos(-player.yaw));

    if(progress >= 1){
      phoenixDiveDescentStartTime = performance.now() / 1000;

  if(phoenixDiveDescentStartTime !== null){

    const peakHeight = maxHeight;
    const fallProgress = THREE.MathUtils.clamp(descentTime / 2.0, 0, 1);
    const currentHeight = peakHeight * (1 - fallProgress * fallProgress); // parabola
    player.flyH = currentHeight;

    const groundY = groundHeightAt(player.pos.x, player.pos.z);
    if(currentHeight <= groundY + 0.5){

        parts.push({m:pm,v,life:0,dur:0.5+Math.random()*0.3});
      }
      let ringM=null;
      if(Settings.quality!=='low'){ ringM=new THREE.Mesh(new THREE.RingGeometry(0.5*s,1.0*s,32), new THREE.MeshBasicMaterial({color:0xffc46e,transparent:true,opacity:0.9,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false})); ringM.position.copy(impactPos); ringM.lookAt(camera.position); scene.add(ringM); }

          if(!t.alive) continue;
          const c=t.rig.group.position.clone(); c.y=1.2;
          if(c.distanceTo(impactPos)<=diveRadius+0.6){
            const knockbackForce = (diveRadius - c.distanceTo(impactPos)) / diveRadius;
            applyDamage(t, diveDmg, impactPos.clone(), 1.0, 'phoenixdive');

          }

function executePhoenixExecution(t){
  // Disintegration execution: target breaks apart into Phoenix particles
  if(!t.alive) return;
  // Mark as dead immediately
  t.alive = false;
  t.health = 0;
  // Create disintegration effect: target breaks into glowing Phoenix particles
  const q=Q(), s=q.boomScale*1.5;
  const explosionPos = t.rig.group.position.clone();
  // Large burst of Phoenix particles
  const particleCount = 30;
  for(let i=0;i<particleCount;i++){
    const m = fxSpawn(fireEmberGeo, 0xfff6c8, true, 1.0);
    if(!m) break;
    m.position.copy(explosionPos);
    const ang = (i/particleCount)*Math.PI*2;
    const tilt = Math.random()*Math.PI/2;
    const v = new THREE.Vector3(Math.cos(ang)*Math.cos(tilt), Math.sin(tilt)*2 + 1, Math.sin(ang)*Math.cos(tilt)).normalize().multiplyScalar(5 + Math.random()*3);
    m.userData.velocity = v;
    m.position.y += Math.random()*2;
    m.scale.setScalar(0.3 + Math.random()*0.3);
    // Will be updated in the next frame
    scene.add(m);
  }
  // Small impact flash
  const flash = new THREE.Mesh(new THREE.SphereGeometry(0.5*s,14,12), new THREE.MeshBasicMaterial({color:0xffd76e,transparent:true,opacity:0.95,blending:THREE.AdditiveBlending,depthWrite:false}));
  flash.position.copy(explosionPos); scene.add(flash);
  explosions.push({flash,parts:[],ringM:null,life:0,dur:0.5});
  if(q.boomLight) pulseLight(explosionPos,8);
  // Standard elimination path (keeps respawn working): fall over in place,
  // clear burn, respawn timer restarts the duel. Rig/blob stay in the scene.
  try{ clearBurn(t); }catch(e){}
  try{ if(t.phoenixTornado) t.phoenixTornado=null; }catch(e){}
  t.respawnT=RESPAWN_DELAY;
  updateHealthBar(t);
  // Fire elimination sound
  SFX.hitmarkerKill();
  // Update kill counter
  updateKillCounter();
  toast('ELIMINATED!');
}

function updateProjectiles(dt){
  const q=Q();
  const _prev=new THREE.Vector3();
  for(let i=projectiles.length-1;i>=0;i--){ const p=projectiles[i];
    if(p.target && p.target.alive && Settings.aimAssist && !p.hostile) homingSteerDT(p,dt,p.agile?10:7);
    _prev.copy(p.mesh.position);
    const step=p.vel.clone().multiplyScalar(dt);
    p.mesh.position.add(step); p.traveled+=step.length(); p.life+=dt;
    orientAlong(p.mesh, p.vel);
    p.flame.scale.set(1,0.8+Math.random()*0.6,1);
    // smoke trail (quality-scaled rate, pooled meshes)
    p.smokeT-=dt;
    if(p.smokeT<=0 && Math.random()<q.smokeRate){
      p.smokeT=0.05;
      const tm=fxSpawn(smokeGeo,0xcccccc,false,0.55);
      if(tm){ tm.position.copy(p.mesh.position); p.trailMeshes.push({m:tm,life:0}); }
      if(p.trailMeshes.length>q.trail){ const old=p.trailMeshes.shift(); fxKill(old.m); }
    }
    for(let j=p.trailMeshes.length-1;j>=0;j--){ const tr=p.trailMeshes[j]; tr.life+=dt; tr.m.material.opacity=Math.max(0,0.55-tr.life*1.8); tr.m.scale.multiplyScalar(1+dt*1.5); if(tr.life>0.4){ fxKill(tr.m); p.trailMeshes.splice(j,1);} }
    const mp=p.mesh.position;
    if(p.hostile){
      // RIVAL ordnance: threatens the player only, never training dummies
      const hitP=missileHitsPlayer(_prev,mp);
      const hitWallH=Math.abs(mp.x)>PLAY_HALF+0.4||Math.abs(mp.z)>PLAY_HALF+0.4;
      const hitCoverH=!hitP && pointInObstacles(mp);
      if(hitP && !p.hitDone){ p.hitDone=true; explodeMissile(mp.clone(),0,p.radius,p.big); applyDamageToPlayer(p.dmg,mp.clone(),1); destroyProj(i); }
      else if(!hitP && (mp.y<0.12||hitWallH||hitCoverH||mp.y>40)){ explodeMissile(mp.clone(),0,p.radius,p.big); if(mp.y<3){ const c=playerChest(new THREE.Vector3()); if(c.distanceTo(mp)<=p.radius+0.6) applyDamageToPlayer(Math.max(1,Math.round(p.dmg*0.6)),mp.clone(),0.8); } destroyProj(i); }
      else if(p.traveled>p.maxRange||p.life>4){ explodeMissile(mp.clone(),0,p.radius,false); destroyProj(i); }
      continue;
    }
    const hit=missileHitsTarget(_prev,mp);
    const hitWall=Math.abs(mp.x)>PLAY_HALF+0.4||Math.abs(mp.z)>PLAY_HALF+0.4;
    const hitCover=!hit && pointInObstacles(mp); // structures detonate missiles too
    if(hit && !p.hitDone){ p.hitDone=true; explodeMissile(mp.clone(),p.dmg,p.radius,p.big); destroyProj(i); }
    else if(!hit && (mp.y<0.12||hitWall||hitCover||mp.y>40)){ explodeMissile(mp.clone(),hitCover?p.dmg:0,p.radius,p.big); destroyProj(i); }
    else if(p.traveled>p.maxRange||p.life>4){ explodeMissile(mp.clone(),0,p.radius,false); destroyProj(i); }
  }
}
function updateExplosions(dt){
  for(let i=explosions.length-1;i>=0;i--){ const e=explosions[i]; e.life+=dt; const k=e.life/e.dur;
    if(k>=1){ if(e.flash) fxFree(e.flash); if(e.ringM) fxFree(e.ringM); e.parts.forEach(p=>fxFree(p.m)); explosions.splice(i,1); continue; }
    if(e.flash){ e.flash.scale.setScalar(1+k*3.2); e.flash.material.opacity=0.95*(1-k); }
    if(e.ringM){ e.ringM.scale.setScalar(1+k*4); e.ringM.material.opacity=0.9*(1-k); }
    for(const p of e.parts){ p.life+=dt; p.v.y-=dt*12; p.m.position.addScaledVector(p.v,dt); p.m.material.opacity=Math.max(0,1-p.life/p.dur); if(p.m.position.y<0.05){p.m.position.y=0.05;p.v.y*=-0.4;} }
  }
}

function applyDamage(t, dmg, at, kick=1, src=null){
  if(!t.alive) return;
  t.health-=dmg;
  const reactK=THREE.MathUtils.clamp(0.30+dmg*0.042,0.22,1.5);
  t.flash=Math.min(1.5,kick*reactK); t.recoil=Math.min(1.5,kick*reactK);
  const wp=t.rig.group.position.clone(); wp.y=2.3;
  spawnDamageNumber(wp,dmg,dmg>=20);
  updateHealthBar(t);
  SFX.hit();
  const killed=t.health<=0;
  try{ pulseHitmarker(killed); }catch(e){}
  if(killed) SFX.hitmarkerKill(); else SFX.hitmarker();
  if(src==='spin' || src==='laser'){ triggerShake(0.05,0.08); }

  // CROWD-CONTROL INTEGRATION: Apply CC based on damage source and magnitude
  // Only apply to alive targets, not killing blows (death handles its own physics)
  if(!killed && dmg > 0){
    const isHeavy = dmg >= 14; // Heavy hits: stage-3, pyro, nova, dive, burst
    const isExplosive = src==='pyro' || src==='nova' || src==='phoenixburst' || src==='phoenixdive';
    const isSpin = src==='spin';
    const isLaser = src==='laser';
    const isFlame = src==='flame';
    const isDrain = src==='phoenixdrain';
    const isFury = src==='phoenixfury';
    
    // KNOCKBACK: Explosive and heavy hits apply directional knockback
    if(isExplosive || isHeavy || isSpin){
      const kbForce = CC.knockback.baseForce * (isExplosive ? 2.0 : isHeavy ? 1.5 : 1.0);
      applyKnockback(t, kbForce, at, isExplosive ? 0.4 : 0.25);
    }
    
    // RAGDOLL: Explosive hits and heavy melee cause physics tumble
    if(isExplosive || (isHeavy && (src==='pyro' || src==='nova' || src==='phoenixdive' || src==='phoenixburst'))){
      applyRagdoll(t, isExplosive ? 0.8 : 0.5, at);
    }
    
    // POWER DISABLE: Sustained beam/flame/drain abilities disable powers
    if(isLaser || isFlame || isDrain || isFury){
      applyPowerDisable(t, isFury ? 2.0 : isLaser ? 1.0 : isFlame ? 1.2 : 1.5);
    }
  }

  if(t.health<=0){ t.alive=false; t.health=0; t.respawnT=RESPAWN_DELAY; updateHealthBar(t);
    try{ clearBurn(t); clearAllCC(t); }catch(e){}
    if(src==='laser'||src==='spin'||src==='flame'||src==='nova'||src==='pyro'||src==='burn') hitStop(0.045);
    toast('TARGET DOWN!'); updateKillCounter();
    if(src==='laser'){ AB.volley.cd=Math.max(0,AB.volley.cd-activeKit().synergy.laserKillVolleyRefund); flashBtn(1); }
    if(lockedTarget===t) clearLock();
    try{ if(t.isBot){ cleanupBotFight(t); if(t.bot) t.bot.engaged=false; toast('RIVAL DOWN!'); updateDuelHpUI(); } }catch(e){}
  }
  try{ if(t.isBot) botOnDamaged(t, dmg, at); }catch(e){}
}

/* ---- hostile projectile hit test: swept segment vs player torso ---- */
const _phpDir=new THREE.Vector3();
function missileHitsPlayer(p0,p1){
  if(!player.alive) return false;
  const cx=player.pos.x, cy=player.flyH+1.2, cz=player.pos.z;
  _phpDir.copy(p1).sub(p0);
  const L=_phpDir.length();
  if(L<1e-6){
    const dx=p0.x-cx, dz=p0.z-cz;
    return dx*dx+dz*dz<TGT_R*TGT_R && Math.abs(p0.y-cy)<1.7;
  }
  _phpDir.divideScalar(L);
  const ox=cx-p0.x, oy=cy-p0.y, oz=cz-p0.z;
  const tca=ox*_phpDir.x+oy*_phpDir.y+oz*_phpDir.z;
  if(tca<-0.8||tca>L+0.8) return false;
  const k=THREE.MathUtils.clamp(tca,0,L);
  const dx=_phpDir.x*k-ox, dy=_phpDir.y*k-oy, dz=_phpDir.z*k-oz;
  return dx*dx+dy*dy+dz*dz<=TGT_R*TGT_R;
}

function updateBotAbility(t, dt){
  const b=t.bot;
  // windup: slow down, track the player, then commit (interrupted by ragdoll/death)
  if(b.windup){
    if(!t.alive || t.ragdollT>0){ b.windup=null; return; }
    b.windupT-=dt;
    if(b.windupT<=0){
      const kind=b.windup; b.windup=null;
      if(kind==='spin') botExecSpin(t);
      else if(kind==='volley') botExecVolley(t);
      else if(kind==='laser') botExecLaser(t);
    }
    return true; // winding up: no basics
  }
  // spin: whirl in place, punishing only close range (same 6/0.35s numbers)
  if(b.spinT>0){
    b.spinT-=dt; b.yaw+=13*dt;
    t.rig.group.rotation.y=b.yaw; // the whirl must visibly turn the body
    b.spinBurst-=dt;
    if(b.spinBurst<=0){ b.spinBurst=0.16; spawnPalmBurst(botHandMid(t),0xff8a5e); }
    b.spinTick-=dt;
    if(b.spinTick<=0){
      b.spinTick=0.35;
      const bp=t.rig.group.position;
      const dx=player.pos.x-bp.x, dz=player.pos.z-bp.z, dy=(player.flyH+1.2)-1.0;
      if(Math.sqrt(dx*dx+dy*dy+dz*dz)<=6.5 && player.alive) applyDamageToPlayer(6, bp.clone(), 0.8, 'spin');
    }
    if(b.spinT<=0) b.spinT=0;
    return true;
  }
  // laser: sustained beam while LOS + range hold (same 3.5/0.2s numbers)
  if(b.laserT>0){
    b.laserT-=dt;
    const origin=botHandMid(t);
    const aim=playerChest(new THREE.Vector3());
    const dist=origin.distanceTo(aim);
    let blocked=true;
    try{ blocked=losBlocked(origin,aim); }catch(e){ blocked=false; }
    const ok=player.alive && !blocked && dist<=24 && b.laserT>0;
    const end=ok?aim:origin.clone().add(aim.clone().sub(origin).normalize().multiplyScalar(Math.min(dist,10)));
    if(b.laserMeshes){
      const dir=end.clone().sub(origin); const len=Math.max(0.1,dir.length()); dir.divideScalar(len);
      for(const [mesh,w] of [[b.laserMeshes[0],0.07*Q().beamWidth],[b.laserMeshes[1],0.22*Q().beamWidth]]){
        mesh.position.copy(origin).add(end).multiplyScalar(0.5);
        mesh.scale.set(w,Math.max(0.1,len),w);
        mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);
      }
    }
    b.laserTick-=dt;
    if(b.laserTick<=0){
      b.laserTick=0.2;
      if(ok) applyDamageToPlayer(3.5, origin.clone(), 0.4, 'laser');
    }
    if(b.laserT<=0 || !player.alive) botEndLaser(t);
    return true;
  }
  return false;
}
/* ---- the brain: strafe, approach, dodge, aim, attack, abilities ---- */
const _botTmp=new THREE.Vector3(), _botTmp2=new THREE.Vector3();
function updateCombatBot(dt){
  const t=combatBot();
  if(!t || !t.bot) return;
  const b=t.bot;
  b.cdSpin=Math.max(0,b.cdSpin-dt); b.cdVolley=Math.max(0,b.cdVolley-dt);
  b.cdLaser=Math.max(0,b.cdLaser-dt); b.dodgeCd=Math.max(0,b.dodgeCd-dt);
  if(!t.alive){ cleanupBotFight(t); return; }
  const bp=t.rig.group.position;
  if(!b.engaged){ return; } // passive dummy until first damaged
  if(!player.alive){ cleanupBotFight(t); b.holdFire=0.5; return; } // ceasefire while downed
  // face the player with human turn speed + slight wobble
  const wantYaw=Math.atan2(player.pos.x-bp.x, player.pos.z-bp.z);
  let dy=wantYaw-b.yaw; while(dy>Math.PI)dy-=Math.PI*2; while(dy<-Math.PI)dy+=Math.PI*2;
  const maxTurn=BOT.turnRate*dt;
  b.yaw+=THREE.MathUtils.clamp(dy,-maxTurn,maxTurn);
  t.rig.group.rotation.y=b.yaw;
  const ragdolled=t.ragdollT>0;
  // --- locomotion: hold 7-14m band, orbit, dash-dodge ---
  const toP=_botTmp.set(player.pos.x-bp.x,0,player.pos.z-bp.z);
  const dist=toP.length();
  if(toP.lengthSq()>1e-4) toP.divideScalar(dist||1);
  const tangent=_botTmp2.set(-toP.z,0,toP.x).multiplyScalar(b.strafeDir);
  b.strafeT-=dt;
  if(b.strafeT<=0){ b.strafeDir*=-1; b.strafeT=2+Math.random()*2; tangent.multiplyScalar(-1); }
  const winding=b.windup?0.4:1;
  const vel=new THREE.Vector3();
  if(b.dodgeT>0){
    b.dodgeT-=dt;
    vel.copy(b.dodgeDir).multiplyScalar(BOT.dodgeSpeed);
  } else if(!ragdolled){
    if(dist>BOT.idealMax) vel.addScaledVector(toP,1).addScaledVector(tangent,0.5);
    else if(dist<BOT.idealMin) vel.addScaledVector(toP,-1).addScaledVector(tangent,0.6);
    else vel.addScaledVector(tangent,1).addScaledVector(toP,Math.sin(performance.now()*0.001+t.uid)*0.35);
    vel.normalize().multiplyScalar(BOT.speed*winding);
  }
  bp.x+=vel.x*dt; bp.z+=vel.z*dt;
  clampToArena(bp,1.5);
  collideObstacles(bp,0,true);
  // --- reactive dodge: incoming player projectiles + active laser ---
  if(b.dodgeCd<=0 && !ragdolled){
    let threat=null;
    const lists=[projectiles,volleyMissiles,fireballs,pyroShots];
    for(const arr of lists){
      for(const p of arr){
        if(p.hostile) continue;
        const mp=p.mesh?p.mesh.position:(p.group?p.group.position:null);
        if(!mp) continue;
        _botTmp.copy(mp).sub(bp); _botTmp.y=0;
        if(_botTmp.length()<7){ threat=mp; break; }
      }
      if(threat) break;
    }
    if(!threat && AB.laser.holding && dist<26 && Math.random()<0.5) threat=player.pos;
    if(threat){
      const away=bp.clone().sub(threat); away.y=0;
      if(away.lengthSq()<0.01) away.set(Math.random()-0.5,0,Math.random()-0.5);
      away.normalize();
      const perp=new THREE.Vector3(-away.z,0,away.x).multiplyScalar(b.strafeDir);
      botDodge(t, perp.addScaledVector(away,0.6).normalize());
    }
  }
  if(ragdolled) return;
  // --- offense: abilities by range with telegraphs, basics otherwise ---
  const origin=botHandMid(t);
  const aim=playerChest(new THREE.Vector3());
  let blocked=true;
  try{ blocked=losBlocked(origin,aim); }catch(e){ blocked=false; }
  const busy=updateBotAbility(t,dt);
  if(busy || blocked || dist>40) return;
  if(b.windup) return;
  if(dist<=6.5 && b.cdSpin<=0){ botStartWindup(t,'spin'); return; }
  if(dist>=8 && dist<=30 && b.cdVolley<=0){ botStartWindup(t,'volley'); return; }
  if(dist>=6 && dist<=24 && b.cdLaser<=0){ botStartWindup(t,'laser'); return; }
  b.atkT-=dt;
  if(b.atkT<=0) botFireBasic(t);
  updateDuelHpUI();
}

function joyHandle(e){ const r=joyEl.getBoundingClientRect(); const cx=r.left+r.width/2, cy=r.top+r.height/2;
  let dx=e.clientX-cx, dy=e.clientY-cy; const max=r.width/2-10; const len=Math.hypot(dx,dy);

// camera orbit by dragging anywhere except UI — fully unrestricted (straight up/down allowed)
let camYaw=Math.PI, camPitch=0.32, dragging=false, lastX=0,lastY=0, dragId=null;

addEventListener('pointerdown',e=>{ ensureAudio(); if(e.target.closest('#joystick,#combat-cluster,#settings-panel,#char-panel,#fly-alt,#settings-btn,#fs-btn,#char-btn,.qbtns,.seg,button'))return; dragging=true; dragId=e.pointerId; lastX=e.clientX; lastY=e.clientY; tapDownX=e.clientX; tapDownY=e.clientY; tapDownT=performance.now(); tapMoved=false; },{passive:true});
addEventListener('pointermove',e=>{ if(!dragging||e.pointerId!==dragId)return; const dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
  if(Math.hypot(e.clientX-tapDownX,e.clientY-tapDownY)>10) tapMoved=true;

  // TPS pitch limit (±66°): a near-vertical clamp makes the orbit flip controls
  // and breaks aim-reading; a tight limit keeps camera-relative movement and
  // aiming legible at every angle, like commercial third-person shooters.
  camPitch=THREE.MathUtils.clamp(camPitch,-1.15,1.15); },{passive:true});

  // tap (not drag) on open space: try manual target lock, never disturbs camera

/* Manual target lock: tap a dummy to prioritize it for ~2.5s. Aim assist keeps
   validating range/alive state; manual aim is never overridden permanently. */

function tryTapLock(px,py){
  if(!Settings.aimAssist){ toast('ENABLE AIM ASSIST TO LOCK'); return; }
  _tapNdc.set((px/innerWidth)*2-1, -((py/innerHeight)*2-1));
  aimRaycaster.setFromCamera(_tapNdc,camera);
  const ray=aimRaycaster.ray;
  let best=null, bestD=2.0;
  for(const t of targets){
    if(!t.alive) continue;
    const c=t.rig.group.position.clone(); c.y=1.3;
    const toC=c.clone().sub(ray.origin); const proj=toC.dot(ray.direction);
    if(proj<1||proj>MAX_DIST) continue;
    const perp=ray.origin.clone().addScaledVector(ray.direction,proj).distanceTo(c);
    if(perp<bestD){
      // never tap-lock through cover — keeps manual aim honest
      try{ if(typeof losBlocked==='function' && losBlocked(camera.position,c)) continue; }catch(e){}
      bestD=perp; best=t;
    }
  }
  if(best){ manualLock=best; manualLockUntil=performance.now()+2500; SFX.ui(); }
}

/* camera effects controller: ONE owner of combat camera offsets.
   Shake (random) + kick (directional dolly, never rotates view so aim stays
   precise) are combined here, decayed safely, and applied AFTER collision so
   effects can never push the camera through floor/walls. All gated by the
   camera-shake setting. */
let shakeAmp=0, shakeT=0;
let kickAmt=0; // decaying dolly offset along view dir (positive = pull back)
function triggerShake(amp,dur){ if(!Settings.shake) return; shakeAmp=Math.max(shakeAmp,amp); shakeT=Math.max(shakeT,dur); }
function camKick(strength){ if(!Settings.shake) return; kickAmt=Math.min(0.55,kickAmt+strength); }
function hitVignette(){ const v=document.getElementById('hit-vignette'); v.style.opacity='1'; setTimeout(()=>v.style.opacity='0',130); }
/* Screen-space gated impact feedback: only flash the vignette when the impact is

   still shake/feel — but a full-screen flash for something you cannot see is
   noise, not feedback. */
const _vgNdc=new THREE.Vector3();
function hitVignetteAt(pos, strength=0.9){
  if(!pos){ hitVignette(); return; }
  _vgNdc.copy(pos).project(camera);

  const sx=(_vgNdc.x*0.5+0.5)*innerWidth, sy=(-_vgNdc.y*0.5+0.5)*innerHeight;
  if(sx<-60||sx>innerWidth+60||sy<-60||sy>innerHeight+60) return; // off-screen: no flash

function startVolley(){

  // Never cancels flight — smooth air-to-volley transition by design.
  const hand=handWorldPos();

  if(Settings.aimAssist && lockedTarget && lockedTarget.alive){ tgt=lockedTarget; aimPoint=lockedTarget.rig.group.position.clone(); aimPoint.y=1.35; }
  else aimPoint=computeAimPoint(130);
  const wantYaw=Math.atan2((aimPoint.x-hand.x),(aimPoint.z-hand.z));
  let dy=wantYaw-player.yaw; while(dy>Math.PI)dy-=Math.PI*2; while(dy<-Math.PI)dy+=Math.PI*2;
  player.yaw+=dy*0.7; // ease toward launch — no snap, keeps strafe coherent
  // MULTI-TARGET DISTRIBUTION: a Marvel-Rivals volley pressures a GROUP, not a
  // single dummy six times over. Locked target gets the lead pair; remaining
  // missiles are assigned round-robin to the other valid targets closest to the
  // launch direction (each needs 2 missiles minimum to matter). Without aim
  // assist every missile keeps the raw aim point (manual aiming stays honest).
  let assign=[tgt];

    const adir=aimPoint.clone().sub(hand); adir.y=0; adir.normalize();
    const others=targets.filter(t=>t.alive&&t!==tgt).map(t=>{
      const to=t.rig.group.position.clone().sub(hand); to.y=0;
      const len=to.length(); if(len<1) return null;
      to.divideScalar(len);
      const ang=adir.angleTo(to);
      if(ang>0.5) return null;
      const incam=(typeof camera!=='undefined')?camera.position.distanceTo(t.rig.group.position):len;
      if(incam>MAX_DIST) return null;
      return {t,ang};
    }).filter(Boolean).sort((a,b)=>a.ang-b.ang).map(o=>o.t).slice(0,2);
    for(const o of others) if(assign.length<3) assign.push(o);
  }

  for(let i=0;i<vk.count;i++){

function bez(p0,p1,p2,t,out){ const a=1-t; out.set(0,0,0).addScaledVector(p0,a*a).addScaledVector(p1,2*a*t).addScaledVector(p2,t*t); return out; }
function updateVolley(dt){

function laserEndpoint(origin,dir){
  const maxRange=laserRange();
  let best=maxRange;
  // walls + live test structures block (precomputed static + obstacle boxes)
  obstacleBoxes(_occBoxes);
  for(const box of _occBoxes){
    _lray.set(origin,dir);
    if(_lray.intersectBox(box,_hitP)){ const d=_hitP.distanceTo(origin); if(d<best) best=d; }
  }
  // floor blocks
  if(dir.y<-0.001){ const t=-origin.y/dir.y; if(t>0&&t<best) best=t; }
  return {point:origin.clone().addScaledVector(dir,best), dist:best};

function updateLaser(dt){
  if(!AB.laser.holding) return;
  AB.laser.t-=dt;
  if(AB.laser.t<=0){ endLaser(true); return; }
  const L=palmWorld(playerRig.handL), R=palmWorld(playerRig.handR);
  const origin=L.clone().add(R).multiplyScalar(0.5);
  let dir;
  if(Settings.aimAssist && lockedTarget && lockedTarget.alive){
    const c=lockedTarget.rig.group.position.clone(); c.y=1.35; dir=c.sub(origin).normalize();
  } else dir=computeAimPoint(130).sub(origin).normalize();
  const {point,dist}=laserEndpoint(origin,dir);
  // ---- BEAM CLASH: per-frame compatible-beam detection (fast, not tick-gated) ----
  // Finds the nearest clash-capable training target actually struck by this beam
  // segment (respects range via dist + radius check). LOS/occlusion is validated
  // inside tryTriggerClash so cover never starts a clash.
  try{
    if(!beamClash && clashCooldownT<=0 && AB.laser.beamId!==lastClashBeamId){
      let hitT=null, hitD=1.4;
      for(const t of targets){
        if(!t.alive || t.canClash===false) continue;
        const c=t.rig.group.position.clone(); c.y=1.3;
        const along=c.clone().sub(origin).dot(dir);
        if(along<1||along>dist) continue;
        const perp=origin.clone().addScaledVector(dir,along).distanceTo(c);
        if(perp<hitD){ hitD=perp; hitT=t; }
      }
      if(hitT) tryTriggerClash(hitT, origin, dir, dist);
    }
  }catch(e){}
  // Advance pending/active clash BEFORE rendering so the player beam can be
  // truncated at the live collision point this same frame (no overlap/passthrough).
  let clashPoint=null;
  try{ clashPoint=updateBeamClash(dt, origin, dir, dist); }catch(e){ clashPoint=null; }
  const renderEnd=(clashPoint||point);
  const renderDist=clashPoint?Math.max(0.1,origin.distanceTo(clashPoint)):dist;
  for(const [mesh,w] of [[laserCore,0.07*Q().beamWidth],[laserGlow,0.22*Q().beamWidth]]){
    mesh.position.copy(origin).add(renderEnd).multiplyScalar(0.5);
    mesh.scale.set(w,Math.max(0.1,renderDist),w);
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),clashPoint?renderEnd.clone().sub(origin).normalize():dir);
  }
  palmGlowL.position.copy(L); palmGlowR.position.copy(R);
  const s=1+Math.random()*0.25; palmGlowL.scale.setScalar(s); palmGlowR.scale.setScalar(s);
  if(laserTip){
    if(clashPoint){ laserTip.visible=false; } // clash core replaces the normal tip
    else { laserTip.visible=true; laserTip.position.copy(point); laserTip.scale.setScalar(1+0.15*Math.sin(performance.now()*0.03)); }
  }
  if(laserHum){ try{ laserHum.o.frequency.value=95+9*Math.sin(performance.now()*0.025); }catch(e){} }
  // impact feedback at endpoint (quality-scaled, pooled) — suppressed during clash (clash FX owns the point)
  if(!clashPoint && Math.random()<Q().smokeRate){
    const pm=fxSpawn(smokeGeo,0x9fe8ff,true,0.8);
    if(pm){ pm.position.copy(point); explosions.push({flash:pm,parts:[],ringM:null,life:0,dur:0.15}); }
  }
  // controlled damage ticks, nearest target near the beam segment
  AB.laser.tick-=dt;
  if(AB.laser.tick<=0){
    const lk=activeKit().abilities.laser; AB.laser.tick=lk.tick;
    let bestT=null,bestD=1.4;
    for(const t of targets){
      if(!t.alive) continue;
      const c=t.rig.group.position.clone(); c.y=1.3;
      const along=c.clone().sub(origin).dot(dir);
      if(along<1||along>renderDist) continue;
      const perp=origin.clone().addScaledVector(dir,along).distanceTo(c);
      if(perp<bestD){ bestD=perp; bestT=t; }
    }
    if(bestT) applyDamage(bestT,lk.dmg,bestT.rig.group.position.clone().setY(1.6),0.4,'laser');
  }
}
/* ============ BEAM CLASH SYSTEM ============
   Special training-target counter-beam: when a compatible beam ability (laser)
   strikes a clash-capable target, the target answers with its own beam a few
   milliseconds later. Both beams truncate at a shared collision point between
   the sources (never overlapping/passing through) with a continuous high-energy
   clash effect. Fully integrated: respects beam range, line of sight, obstacle
   collision, ability duration and target validity; reuses the pooled FX, light,
   shake, hit-stop and audio buses; quality-scaled for mobile.
   Lifecycle: pending (reaction delay) -> active (both beams + FX) ->
   resolved (final burst + full cleanup). One clash at a time + per-beam id + a
   short cooldown prevents repeated-activation bugs while allowing clean re-fire. */
const CLASH={
  reactionDelay:0.008,  // configurable reaction delay (seconds, ~8ms)
  bias:0.55,            // collision point lerp player->target (0.5 = midpoint)
  enemyDur:3.2,         // target beam max lifetime; expiry resolves clash, player beam continues
  cooldown:0.5,         // post-clash lockout before a NEW beam may clash again
  enemyCoreCol:0xfff2f5,
  enemyGlowCol:0xff4d81,

function destroyPyro(i){ const p=pyroShots[i]; freeShotGroup(p.mesh); p.trailMeshes.forEach(t=>fxKill(t.m)); pyroShots.splice(i,1); }
function updatePyroShots(dt){
  const q=Q();
  const _prev=new THREE.Vector3();
  for(let i=pyroShots.length-1;i>=0;i--){ const p=pyroShots[i];
    if(p.target && p.target.alive && Settings.aimAssist) homingSteerDT(p,dt,5);
    _prev.copy(p.mesh.position);
    const step=p.vel.clone().multiplyScalar(dt);
    p.mesh.position.add(step); p.traveled+=step.length(); p.life+=dt;
    const fl=0.9+Math.random()*0.6;
    p.core.scale.setScalar(fl); p.glow.scale.setScalar(1+Math.random()*0.3); p.outer.scale.setScalar(1.05-Math.random()*0.2);
    // dense flame trail: 2 embers per step + smoke
    for(let k=0;k<2;k++){
      if(Math.random()<q.trailRate+0.25){
        const em=fxSpawn(fireEmberGeo,Math.random()<0.5?0xff6a1e:0xffd24a,true,0.9);
        if(em){ em.position.copy(p.mesh.position); em.position.x+=(Math.random()-0.5)*0.3; em.position.y+=(Math.random()-0.5)*0.3; em.position.z+=(Math.random()-0.5)*0.3; em.scale.setScalar(0.9+Math.random()*0.8); p.trailMeshes.push({m:em,life:0}); }
      }
    }
    if(Math.random()<0.35){
      const sm=fxSpawn(smokeGeo,0x555555,false,0.4);
      if(sm){ sm.position.copy(p.mesh.position); sm.scale.setScalar(0.8); p.trailMeshes.push({m:sm,life:0}); }
    }
    if(p.trailMeshes.length>q.trail+10){ const old=p.trailMeshes.shift(); fxKill(old.m); }
    for(let j=p.trailMeshes.length-1;j>=0;j--){ const tr=p.trailMeshes[j]; tr.life+=dt;
      tr.m.material.opacity=Math.max(0,0.9-tr.life*2.0); tr.m.scale.multiplyScalar(1+dt*1.8);
      if(tr.life>0.5){ fxKill(tr.m); p.trailMeshes.splice(j,1); } }
    const mp=p.mesh.position;
    const hit=missileHitsTarget(_prev,mp);
    const hitWall=Math.abs(mp.x)>PLAY_HALF+0.4||Math.abs(mp.z)>PLAY_HALF+0.4;
    const hitCover=!hit && pointInObstacles(mp);
    if(hit){ pyroExplode(mp.clone(),hit,p.dmg,p.radius,p.aoeDmg,p.burnDmg,p.burnDur); destroyPyro(i); }
    else if(hitCover){ pyroExplode(mp.clone(),null,p.aoeDmg,p.radius,p.aoeDmg,p.burnDmg,p.burnDur); destroyPyro(i); }
    else if(!hit && (mp.y<0.12||hitWall||mp.y>40)){ pyroExplode(mp.clone(),null,0,p.radius,0,0,0); destroyPyro(i); }
    else if(p.traveled>p.maxRange||p.life>4){ pyroExplode(mp.clone(),null,0,p.radius,0,0,0); destroyPyro(i); }
  }
}

let flyUpHeld=false, flyDownHeld=false;
function updateFlight(dt){
  if(!player.flying) return;
  AB.fly.t-=dt;
  if(AB.fly.t<=0){ endFlight(true); return; }
  // GENUINE COMBAT FLIGHT: camera-relative strafe + forward/back, stable hover,
  // damped climb/descent. Basic missiles + volley stay usable in air (aerial
  // positioning payoff); spin/laser land first for a clean stance transition.
  let jx=joy.x, jy=joy.y;
  if(Math.hypot(jx,jy)<0.15 && (keys.w||keys.a||keys.s||keys.d)){ jx=(keys.d?1:0)-(keys.a?1:0); jy=(keys.s?1:0)-(keys.w?1:0); }
  const mv=Math.hypot(jx,jy);
  _move.set(0,0,0);
  if(mv>0.15){
    const fwd=new THREE.Vector3(Math.sin(camYaw),0,Math.cos(camYaw));
    const right=new THREE.Vector3(-fwd.z,0,fwd.x);
    _move.addScaledVector(fwd,-jy).addScaledVector(right,jx);
    if(_move.lengthSq()>1) _move.normalize();
    // Focused-pressure tradeoff: lasing while flying keeps full steering but
    // bleeds translation speed so hover aiming stays precise.
    const airLasing=(AB.laser&&AB.laser.holding)?0.55:1;
    _move.multiplyScalar(activeKit().abilities.fly.speed*airLasing);
  }
  player.fvel.x=THREE.MathUtils.damp(player.fvel.x,_move.x,8,dt);
  player.fvel.z=THREE.MathUtils.damp(player.fvel.z,_move.z,8,dt);
  player.pos.addScaledVector(player.fvel,dt);
  const fspd=Math.hypot(player.fvel.x,player.fvel.z);
  // In air with a live lock, face the target (precise aerial aiming);
  // otherwise face travel direction. Never snaps.
  const hasLockF=(typeof lockedTarget!=='undefined' && lockedTarget && lockedTarget.alive);
  if(hasLockF && (mv>0.15 || AB.laser.holding)){
    const tp=lockedTarget.rig.group.position;
    const ty=Math.atan2(tp.x-player.pos.x,tp.z-player.pos.z);
    let dd=ty-player.yaw; while(dd>Math.PI)dd-=Math.PI*2; while(dd<-Math.PI)dd+=Math.PI*2;
    player.yaw+=dd*Math.min(1,dt*10);
  } else if(fspd>1){
    const ty=Math.atan2(player.fvel.x,player.fvel.z);
    let dd=ty-player.yaw; while(dd>Math.PI)dd-=Math.PI*2; while(dd<-Math.PI)dd+=Math.PI*2;
    player.yaw+=dd*Math.min(1,dt*6);
  }
  clampToArena(player.pos);
  // airborne: no step-up (vertical clearance rules below decide contact)
  collideObstacles(player.pos,player.flyH,false);
  // altitude: buttons (mobile) + E/Q (desktop), damped for stable hover
  const climb=((flyUpHeld||keys.e)?1:0)-((flyDownHeld||keys.q)?1:0);
  player.flyV=THREE.MathUtils.damp(player.flyV,climb*6,8,dt);
  // never sink into a standable top while airborne — hover rests on platforms
  const floorUnder=groundHeightAt(player.pos.x,player.pos.z);
  player.flyH=THREE.MathUtils.clamp(player.flyH+player.flyV*dt,Math.max(0,floorUnder),FLY_MAX_H);
  if(player.flyH>=FLY_MAX_H-0.01 && player.flyV>0) player.flyV=0; // ceiling holds, no jitter
  if(flightHum){ try{ flightHum.o.frequency.value=58+player.flyV*2.2; }catch(e){} } // thrusters track climb
  // propulsion from both hands + both feet, synced to flight.
  // IRONMAN: cool repulsor blue hands + warm feet. TORCH: full fire propulsion.
  const torchFly=Settings.character==='torch';
  thrustPuff(palmWorld(playerRig.handL),torchFly?0xff7a1e:0x9fe8ff); thrustPuff(palmWorld(playerRig.handR),torchFly?0xff8a2a:0x9fe8ff);
  const fl=new THREE.Vector3(), fr=new THREE.Vector3();
  playerRig.legL.ft.getWorldPosition(fl); playerRig.legR.ft.getWorldPosition(fr);
  thrustPuff(fl,torchFly?0xff5a00:0xffc46e); thrustPuff(fr,torchFly?0xffd24a:0xffc46e);
  // torch flight sheds extra embers for a convincing fire-propulsion read
  if(torchFly && Math.random()<Q().thrustRate){
    const em=fxSpawn(fireEmberGeo,0xff8a2a,true,0.85);
    if(em){ em.position.copy(player.pos); em.position.y+=player.flyH+0.6; em.scale.setScalar(0.8); explosions.push({flash:em,parts:[],ringM:null,life:0,dur:0.3}); }
  }
  if(flyLight){ flyLight.position.copy(player.pos); flyLight.position.y+=player.flyH+1.2; }
}
