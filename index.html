let lockedTarget=null;
const lockEl=document.getElementById('lock-marker');
const MAX_ANGLE_DEG=12, MAX_DIST=70;
const _losRay=new THREE.Raycaster();
function losBlocked(from,to){
  // Line-of-sight: test structures + curbs break locks and manual taps,
  // so indicators never claim a target you cannot actually hit.
  _losRay.set(from,to.clone().sub(from).normalize());
  _losRay.far=from.distanceTo(to)-0.6;
  const hits=_losRay.intersectObjects(camOccluders,false);
  return hits.length>0;
}
function updateAimAssist(){
  if(!Settings.aimAssist){ clearLock(); return; }
  const aimDir=aimRay().direction.clone();
  // Acquisition: smallest angle to the aim ray wins (true aim-direction
  // priority, not nearest-target). Near-equal angles prefer nearer target.
  let best=null,bestAngle=THREE.MathUtils.degToRad(MAX_ANGLE_DEG),bestDist=1e9;
  for(const t of targets){ if(!t.alive) continue;
    const tp=t.rig.group.position.clone(); tp.y=1.4;
    const toT=tp.sub(camera.position); const dist=toT.length(); if(dist>MAX_DIST) continue;
    toT.normalize(); const ang=aimDir.angleTo(toT);
    if(ang<bestAngle-0.026 || (Math.abs(ang-bestAngle)<0.026 && dist<bestDist)){
      // LoS gate at acquisition: never lock through cover
      const wp=t.rig.group.position.clone(); wp.y=1.4;
      if(losBlocked(camera.position,wp)) continue;
      bestAngle=ang; best=t; bestDist=dist;
    }
  }
  // keep current lock if still valid & within slightly larger angle (hysteresis)
  if(lockedTarget && (!lockedTarget.alive || !targets.includes(lockedTarget))){ clearLock(); }
  // manual tap-lock wins while fresh: prioritize the tapped target, keep validating LoS + range
  if(manualLock && performance.now()<manualLockUntil && manualLock.alive && targets.includes(manualLock)){
    const mp=manualLock.rig.group.position.clone(); mp.y=1.4;
    if(mp.distanceTo(camera.position)<MAX_DIST && !losBlocked(camera.position,mp)){
      if(lockedTarget!==manualLock){ lockedTarget=manualLock; SFX.lockOn(); }
      else lockedTarget=manualLock;
    }
    else manualLock=null;
  } else { if(manualLock && performance.now()>=manualLockUntil) manualLock=null;
    if(best){
      // STICKINESS: keep the current lock unless the challenger is clearly
      // closer to the crosshair (3° margin) — stops flicker between two dummies.
      if(lockedTarget && lockedTarget.alive && lockedTarget!==best){
        const lp=lockedTarget.rig.group.position.clone(); lp.y=1.4;
        const lto=lp.sub(camera.position); const ldist=lto.length();
        const lang=aimDir.angleTo(lto.normalize());
        const lockOk=ldist<MAX_DIST && lang<THREE.MathUtils.degToRad(MAX_ANGLE_DEG+6) && !losBlocked(camera.position,lockedTarget.rig.group.position.clone().setY(1.4));
        if(lockOk && bestAngle>lang-THREE.MathUtils.degToRad(3)){ best=null; }
      }
      if(best){
        if(lockedTarget!==best) SFX.lockOn();
        lockedTarget=best;
      }
    }
    else if(lockedTarget){ // validate still in range + LoS
    const tp=lockedTarget.rig.group.position.clone(); tp.y=1.4;
    const toT=tp.sub(camera.position); if(toT.length()>MAX_DIST||!lockedTarget.alive) clearLock();
    else { const ang=aimDir.angleTo(toT.normalize()); if(ang>THREE.MathUtils.degToRad(MAX_ANGLE_DEG+6)) clearLock(); else if(losBlocked(camera.position,lockedTarget.rig.group.position.clone().setY(1.4))) clearLock(); }
    }
  }
  if(lockedTarget){ const wp=lockedTarget.rig.group.position.clone(); wp.y=1.5; const s=worldToScreen(wp);
    if(s.visible){
      lockEl.style.display='block'; lockEl.style.left=s.x+'px'; lockEl.style.top=s.y+'px';
      // readable + stable: scale slightly with distance so near/far locks stay legible
      const d=camera.position.distanceTo(wp);
      const sc=THREE.MathUtils.clamp(1.15-d*0.008,0.8,1.15);
      lockEl.style.transform=`scale(${sc.toFixed(3)})`; lockEl.style.transformOrigin='center';
    }
    else lockEl.style.display='none';
  } else lockEl.style.display='none';
}
function clearLock(){ lockedTarget=null; lockEl.style.display='none'; }

/* ============ ANIMATION ============ */
/* ============ PLAYER ANIMATION CONTROLLER ============
   Layered priorities: base locomotion (idle/walk) → aim (spine+casting arm) →
   action overlays (attack timeline, volley, laser, spin, flight). Each layer
   only writes its own joints; every joint is damped toward its target, so no
   snapping, twisting, or stuck poses. R6's locked mid-joints are never driven
   (block-style whole-limb motion compensates); R15 uses full articulation.

   FIXES APPLIED:
   - Proper joint hierarchy for both R6 and R15
   - Smooth blend weights with anti-popping
   - Correct foot IK for both rig types
   - Fixed spine/torso articulation
   - Proper aim integration without joint breaking
   - Ragdoll recovery with physics-based settling */
function dampAxis(obj, axis, target, lambda, dt){ 
  if(!obj) return; 
  obj.rotation[axis]=THREE.MathUtils.damp(obj.rotation[axis], target, lambda, dt); 
}
function sstep(a,b,x){ const t=THREE.MathUtils.clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
// Capability-aware joint appliers: identical calls work on R6 and R15.
function solveArm(r,arm,tx,tz,te,dt){
  if(!arm || !arm.sh) return;
  const boost=r.type==='r6'?1.12:1.0;
  dampAxis(arm.sh,'x',tx*boost,14,dt);
  dampAxis(arm.sh,'z',tz,10,dt);
  if(arm.el && r.caps.elbows) dampAxis(arm.el,'x',te,14,dt);
  else if(arm.el) arm.el.rotation.x = 0; // R6: keep locked
}
function solveLeg(r,leg,tx,tk,tf,dt){
  if(!leg || !leg.hp) return;
  dampAxis(leg.hp,'x',tx,14,dt);
  if(leg.kn && r.caps.knees) dampAxis(leg.kn,'x',tk,14,dt);
  else if(leg.kn) leg.kn.rotation.x = 0;
  if(leg.ft && r.caps.knees) dampAxis(leg.ft,'x',tf,14,dt);
  else if(leg.ft) leg.ft.rotation.x = tx*0.4;
}
function pokePlayer(s=1){ player.recoil=Math.min(1,player.recoil+s); } // hit-reaction impulse
/* ============ PLAYER ANIMATION CONTROLLER ============
   Split responsibilities:
     • updatePlayerPhysics  — gravity / jump / landing (vertical sim)
     • animatePlayer        — locomotion integration + procedural posing
   Posing is layered with explicit blend weights (ground → aim → action →
   air), each weight damped so every transition cross-fades instead of
   snapping. R6's mid-joints stay locked via rig.caps; R15 uses full
   articulation. After posing, foot planting compensates root height so the
   lower foot never floats or sinks while grounded. */
function groundControl(dt){
  const lasing=AB.laser.holding;
  const spinning=AB.spin.t>0;
  const accel=player.grounded?14:8; // snappy ground response, lighter air control
  const moveScale=player.grounded?1:0.72;
  // Keyboard override (desktop validation) merges with joystick when stick idle
  const kx=(keys.d?1:0)-(keys.a?1:0), ky=(keys.s?1:0)-(keys.w?1:0);
  let jx=joy.x, jy=joy.y;
  if(Math.hypot(jx,jy)<0.15 && (kx||ky)){ jx=kx; jy=ky; }
  _move.set(0,0,0);
  if(player.moving){
    const cy=Math.cos(camYaw), sy=Math.sin(camYaw);
    _mvF.set(sy,0,cy);
    if(_mvF.lengthSq()<1e-4) _mvF.set(Math.sin(player.yaw),0,Math.cos(player.yaw));
    _mvF.normalize();
    _mvR.set(-_mvF.z,0,_mvF.x);
    _move.addScaledVector(_mvF,-jy).addScaledVector(_mvR,jx);
    if(_move.lengthSq()>1) _move.normalize();
    const effSpeed=player.speed*(lasing?0.8:1)*moveScale;
    _move.multiplyScalar(effSpeed);
  }
  player.vel.x=THREE.MathUtils.damp(player.vel.x,_move.x,accel,dt);
  player.vel.z=THREE.MathUtils.damp(player.vel.z,_move.z,accel,dt);
  player.pos.addScaledVector(player.vel,dt);
  clampToArena(player.pos,1.5);
  // STEP-UP: walking into a low platform/crate puts the player on top of it
  const stepH=collideObstacles(player.pos,player.flyH,true);
  if(stepH && player.grounded && !player.flying) player.flyH=stepH;
  // walked off a platform edge: leave the ground cleanly (coyote covers the step)
  if(player.grounded){
    const gUnder=groundHeightAt(player.pos.x,player.pos.z);
    if(player.flyH-gUnder>0.35){
      player.grounded=false; player.vy=0; player.airT=0; player.coyoteT=0.12;
    } else player.flyH=gUnder;
  }
  const spd=player.vel.length();
  // STRAFE AIM-FACING (Marvel-Rivals feel): while firing the beam, mid-attack,
  // or strafing with a live lock, face the aim — never the movement direction.
  // Otherwise face travel direction. Spin owns the whole body so it is excluded.
  const hasLock=(typeof lockedTarget!=='undefined' && lockedTarget && lockedTarget.alive);
  const strafing=!spinning && (lasing || player.atkT>0 || (hasLock && player.moving));
  if(strafing){
    let targetYaw=camYaw;
    if(hasLock){ const tp=lockedTarget.rig.group.position; targetYaw=Math.atan2(tp.x-player.pos.x,tp.z-player.pos.z); }
    let d=targetYaw-player.yaw; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2;
    player.yaw+=d*Math.min(1,dt*13); // immediate but smooth — no snap
    player.turnVel=THREE.MathUtils.damp(player.turnVel||0,THREE.MathUtils.clamp(d*5,-1.0,1.0),9,dt);
  } else if(spd>1 && !spinning){
    const targetYaw=Math.atan2(player.vel.x,player.vel.z);
    let d=targetYaw-player.yaw; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2;
    player.yaw+=d*Math.min(1,dt*(9+spd)); // snappier turn at speed, smooth at rest
    player.turnVel=THREE.MathUtils.damp(player.turnVel||0,THREE.MathUtils.clamp(d*6,-1.2,1.2),8,dt); // bank into turns
  } else if(!player.moving){
    player.turnVel=THREE.MathUtils.damp(player.turnVel||0,0,8,dt);
  }
  if(player.grounded){
    player.walkPhase+=dt*(4+spd*1.1); // stride rate follows real ground speed
    const si=Math.floor(player.walkPhase/Math.PI);
    if(si!==player.stepIdx){ player.stepIdx=si; if(spd>2.5) SFX.step(); }
  } else {
    player.turnVel=THREE.MathUtils.damp(player.turnVel||0,0,6,dt);
  }
  return spd;
}
function groundFlightControl(dt){
  // Flight translation is owned by updateFlight() (called later in the loop).
  // This only keeps yaw/bank in sync so we never double-integrate position.

    const targetYaw=Math.atan2(player.fvel.x,player.fvel.z);
    let d=targetYaw-player.yaw; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2;
    player.yaw+=d*Math.min(1,dt*6);

  }
  // ---- hit-reaction decay (brief recoil, always recovers) ----
  if(player.recoil>0) player.recoil=Math.max(0,player.recoil-dt*3);

  // ---- locomotion pose targets ----
  const swing=Math.sin(player.walkPhase)*0.6;
  const breath=Math.sin(time*2.2);
  const strafeLean=player.moving?THREE.MathUtils.clamp(-joy.x*0.5,-0.4,0.4):0; // body weight shift
  // vertical aim: upper body + casting arm follow camera pitch, clamped so joints never break
  const aimSpine=THREE.MathUtils.clamp(camPitch*0.16,-0.28,0.32);
  const aimArm=THREE.MathUtils.clamp(-0.55-camPitch*0.45,-2.3,0.4);

  // jump/air/land vertical blends
  const jumpRise=THREE.MathUtils.clamp(player.vy/6,-1,1);   // -1 rising, 1 falling
  const jumpTuck=THREE.MathUtils.clamp(player.jumpT/0.28,0,1);
  const landSquat=wLand*THREE.MathUtils.clamp(player.landT,0,1);

  // hip height: ground bob + airborne tuck + landing squat, blended
  const groundHip=(Math.abs(Math.sin(player.walkPhase))*0.05*wStride+idleBob0(breath)*(1-wStride))
    -0.05*wind+0.02*thrust-player.recoil*0.03-0.09*jumpTuck*wAir-0.24*landSquat;
  const hipsY=HIP_H+groundHip+0.06*wAir;
  r.hips.position.y=THREE.MathUtils.damp(r.hips.position.y,hipsY,12,dt);
  r.hips.position.x=THREE.MathUtils.damp(r.hips.position.x,strafeLean*0.12,8,dt);
  // hips twist into stride (counter to shoulders) — core body movement, not part sliding
  dampAxis(r.hips,'y',(-swing*0.22*wStride)-0.02*wAir,10,dt);
  dampAxis(r.hips,'z',(player.turnVel||0)*0.16,8,dt);

  // legs: walk cycle blends with airborne tuck and landing recovery
  const kneeLg=Math.max(0,-Math.sin(player.walkPhase))*1.0*wStride+0.06*(1-wStride);
  const kneeRg=Math.max(0,Math.sin(player.walkPhase))*1.0*wStride+0.06*(1-wStride);
  // airborne: front knee tucks on rise, trailing leg extends on fall
  const airHipL=THREE.MathUtils.clamp(-0.35-0.5*jumpTuck-0.35*jumpRise,-1.3,0.5);
  const airHipR=THREE.MathUtils.clamp(-0.15+0.25*jumpRise,-0.6,0.9);
  const airKneeL=THREE.MathUtils.clamp(0.75+0.5*jumpTuck+0.25*jumpRise,0.1,1.7);
  const airKneeR=THREE.MathUtils.clamp(0.28-0.35*jumpRise,0.05,1.2);
  const landHip=-0.55*landSquat, landKnee=0.95*landSquat;
  const hipLT=swing*(1-wAir)*(1-wLand)+airHipL*wAir+landHip*wLand-0.55*wFly;
  const hipRT=-swing*(1-wAir)*(1-wLand)+airHipR*wAir+landHip*wLand-0.55*wFly;
  const kneeL=kneeLg*(1-wAir)*(1-wLand)+airKneeL*wAir+landKnee*wLand+0.35*wFly;
  const kneeR=kneeRg*(1-wAir)*(1-wLand)+airKneeR*wAir+landKnee*wLand+0.35*wFly;
  solveLeg(r,r.legL,hipLT,kneeL,-(swing*0.6+kneeL)*0.5,dt);
  solveLeg(r,r.legR,hipRT,kneeR,-(-swing*0.6+kneeR)*0.5,dt);

  // spine / head — flight lean overrides aim lean; recoil adds a brief kick
  const lean=(player.moving?0.07:-0.01+breath*0.012)*wStride;
  const climbLean=wFly>0.1?THREE.MathUtils.clamp(player.flyV*0.03,-0.12,0.2):0;
  const torchFlyLean=(torchHero&&wFly>0.1)?0.22*wFly:0; // torch fire-flight: body drives forward
  const flameLean=wFlame*0.18+wNova*0.1;
  const spineXT=(lean+aimSpine*0.5)*(1-wFly)-player.recoil*0.20-0.08*wSpin+0.12*Math.sin(player.volleyPose>0?(0.6-player.volleyPose)/0.6*Math.PI:0)+climbLean+torchFlyLean+flameLean+0.06*wAir+0.35*landSquat;
  dampAxis(r.spine,'x',spineXT,10,dt);
  dampAxis(r.spine,'y',-0.28*wind+0.32*thrust+(swing*0.16*wStride),12,dt);
  dampAxis(r.spine,'z',THREE.MathUtils.clamp(-strafeLean*0.4-(player.turnVel||0)*0.15,-0.3,0.3),8,dt); // bank + sway
  dampAxis(r.headM,'y',Math.sin(player.walkPhase*0.5)*0.08*wStride+Math.sin(time*0.9)*0.1*(1-wStride),8,dt);
  dampAxis(r.headM,'x',wFly>0.5?-0.85:THREE.MathUtils.clamp(-camPitch*0.15,-0.22,0.22),8,dt);

  // arms: support arm counter-swings in walk; casting arm tracks aim + overlays
  const supArm=-swing*0.6*wStride+breath*0.05*(1-wStride);
  const castArm=aimArm+swing*0.15*wStride+0.45*wind-1.15*thrust;
  const castEl=THREE.MathUtils.clamp(-0.30-0.45*wind+0.24*thrust,-1.9,-0.08);
  if(player.volleyPose>0) player.volleyPose=Math.max(0,player.volleyPose-dt);
  // per-layer arm targets, then weighted blend (no layer ever fights another)
  const spinSh=-1.5, spinZ=1.1, spinEl=-0.25;
  const lasSh=castArm-0.15, lasZ=0.35, lasEl=-0.15;
  const flySh=torchHero?1.15:0.9, flyZ=0.35, flyEl=-0.15;
  const flameSh=castArm-0.25, flameZ=0.3, flameEl=-0.2;
  const novaSh=-1.2, novaZ=1.2, novaEl=-0.3;
  const airShX=THREE.MathUtils.clamp(-0.5+0.7*jumpRise,-1.1,0.9), airShZ=0.5, airEl=-0.2;
  const groundShX=castArm, groundShZ=-0.12, groundEl=castEl;
  const launchLift=wVolley>0.05?-0.9*wVolley:0;
  const wBase=Math.max(0,1-wSpin-wLaser-wFly-wAir-wFlame-wNova);
  const armR_shX=(spinSh*wSpin+lasSh*wLaser+flySh*wFly+airShX*wAir+flameSh*wFlame+novaSh*wNova+groundShX*wBase+launchLift);
  const armR_shZ=(spinZ*wSpin-lasZ*wLaser-flyZ*wFly+airShZ*wAir+flameZ*wFlame+novaZ*wNova+groundShZ*wBase);
  const armR_el=(spinEl*wSpin+lasEl*wLaser+flyEl*wFly+airEl*wAir+flameEl*wFlame+novaEl*wNova+groundEl*wBase);
  solveArm(r,r.armR,armR_shX,armR_shZ,armR_el,dt);
  // support arm mirrors (spread out in spin/air, forward in laser, back in flight)
  const sup_shX=(spinSh*wSpin+lasSh*wLaser+flySh*wFly+(airShX+0.1)*wAir+flameSh*wFlame+novaSh*wNova+(supArm+0.20*thrust)*wBase+launchLift*0.6);
  const sup_shZ=(-spinZ*wSpin+lasZ*wLaser-flyZ*wFly+airShZ*wAir+flameZ*wFlame-novaZ*wNova+0.12*wBase);
  const sup_el=(spinEl*wSpin+lasEl*wLaser+flyEl*wFly+airEl*wAir+flameEl*wFlame+novaEl*wNova-0.40*wBase);
  solveArm(r,r.armL,sup_shX,sup_shZ,sup_el,dt);

  // ---- FOOT PLANTING: root-height compensation so the lower foot never
  // floats or sinks while grounded (works for R6 and R15, no IK needed) ----
  if(r.caps.knees){
    r.legL.ft.getWorldPosition(_footL);
    r.legR.ft.getWorldPosition(_footR);
    const lowest=Math.min(_footL.y,_footR.y);
    if(player.grounded){
      footFixY=THREE.MathUtils.damp(footFixY||0,-lowest,16,dt);
      r.group.position.y=player.flyH+footFixY;
    } else {
      footFixY=THREE.MathUtils.damp(footFixY||0,0,8,dt);
      r.group.position.y=player.flyH;
    }
  } else {
    r.group.position.y=player.flyH; // R6: block legs carry fixed offsets
  }
}
function animateTargets(dt,time){
  for(const t of targets){
    const g=t.rig.group;
    // track world velocity (feeds predictive homing lead + reaction rules)
    if(!t.vel) t.vel=new THREE.Vector3();
    if(!t._lp) t._lp=g.position.clone();
    else if(dt>1e-4) t.vel.copy(g.position).sub(t._lp).multiplyScalar(1/dt);
    t._lp.copy(g.position);
    // blob shadow follows x/z, stays flat on the ground
    t.blob.position.set(g.position.x,0.02,g.position.z);
    // hide blob while fallen, fade back on respawn
    t.blob.material.opacity=(t.alive?QUALITY[Settings.quality].blob:0);
    if(!t.alive){ // fallen: lie back while awaiting respawn
      g.rotation.x=THREE.MathUtils.damp(g.rotation.x,-Math.PI/2.3,6,dt);
      g.position.y=THREE.MathUtils.damp(g.position.y,0.25,6,dt);
      continue;
    }
    // Update crowd-control effects
    updateCrowdControl(t, dt);
    // brief ragdoll tumble (stage-3 blast): recovers safely, never breaks respawn
    if(isRagdolled(t)){
      g.rotation.z=THREE.MathUtils.damp(g.rotation.z,0.9,4,dt);
      g.rotation.x=THREE.MathUtils.damp(g.rotation.x,-0.5,4,dt);
      g.position.y=Math.max(g.position.y,0.35+t.ragdollT*0.5);
      t.hb.grp.lookAt(camera.position);
      continue;
    }
    // idle sway (upper body only — legs are root-fixed so feet stay planted)
    t.rig.hips.position.y=THREE.MathUtils.damp(t.rig.hips.position.y,HIP_H+Math.sin(time*2+g.position.x)*0.02,8,dt);
    t.rig.armL.sh.rotation.x=Math.sin(time*1.8+g.position.z)*0.07;
    t.rig.armR.sh.rotation.x=-Math.sin(time*1.8+g.position.z)*0.07;
    t.rig.armL.el.rotation.x=-0.35; t.rig.armR.el.rotation.x=-0.35;
    // clash-specialist marker: gentle bob + spin, visible only while alive
    try{
      if(t.clashMarker){
        t.clashMarker.visible=(t.alive&&t.canClash===true);
        if(t.clashMarker.visible){ t.clashMarker.position.y=3.05+Math.sin(time*2.4+t.uid)*0.12; t.clashMarker.rotation.y+=dt*2.2; }
      }
    }catch(e){}
    // hit flash decay, fully reset emissive at the end
    if(t.flash>0){
      t.flash=Math.max(0,t.flash-dt*4);
      const f=t.flash;
      t.rig.group.traverse(o=>{ if(o.isMesh&&o.material.emissive!==undefined){ if(f<=0){ o.material.emissive.setRGB(0,0,0); o.material.emissiveIntensity=0; } else { o.material.emissive.setRGB(f*0.9,f*0.08,f*0.08); o.material.emissiveIntensity=f; } } });
    }
    // recoil: lean back quickly, then ease back to standing
    if(t.recoil>0){ t.recoil=Math.max(0,t.recoil-dt*2.2); }
    g.rotation.x=THREE.MathUtils.damp(g.rotation.x,-t.recoil*0.45,18,dt);
    g.position.y=THREE.MathUtils.damp(g.position.y,t.recoil*0.15,18,dt);
    // healthbar billboard (true world-space facing, compensates parent lean)
    t.hb.grp.lookAt(camera.position);
  }
}

/* ============ CAMERA (free-look + floor/wall collision) ============ */
let smoothCamDist=6.2;
const _camDir=new THREE.Vector3(), _camWant=new THREE.Vector3(), _camPivot=new THREE.Vector3(), _camFinal=new THREE.Vector3();
const _camRay=new THREE.Raycaster();
/* SPRING FOLLOW: the camera lags the character slightly (Marvel Rivals weight).
   Instant follow reads stiff on mobile; a damped x/z position makes strafes
   readable without ever changing the aim — the pivot and rotation stay exact,
   only the eye position trails, and occlusion snaps back to prevent clipping. */
const camLag=new THREE.Vector3();
const CAM_LAG_XZ=15, CAM_LAG_Y=20, FOV_BASE=62;
let fovKick=0;
function fovPunch(amt){ if(!Settings.shake||Settings.quality==='low') return; fovKick=Math.min(5,fovKick+amt); }
function updateCamera(dt){
  const px=player.pos.x, py=1.7+player.flyH, pz=player.pos.z;
  // AERIAL FRAMING: rise + pull back slightly with altitude so dives, hover
  // strafes and volley arcs stay readable. Ground framing is untouched.
  const altK=THREE.MathUtils.clamp(player.flyH/FLY_MAX_H,0,1);
  const frameDist=camDist+altK*1.4;
  _camPivot.set(px,py+0.3+altK*0.5,pz);
  const cx=px - Math.sin(camYaw)*Math.cos(camPitch)*frameDist;
  const cz=pz - Math.cos(camYaw)*Math.cos(camPitch)*frameDist;
  const cy=py + Math.sin(camPitch)*frameDist + 0.6;
  _camWant.set(cx,cy,cz);
  // collision: pull in when floor or curb blocks the view (never clip through)
  _camDir.copy(_camWant).sub(_camPivot);
  let wantDist=_camDir.length();
  _camDir.normalize();
  let blockedDist=wantDist;
  _camRay.set(_camPivot,_camDir); _camRay.far=wantDist;
  const hits=_camRay.intersectObjects(camOccluders,false);
  if(hits.length) blockedDist=Math.min(blockedDist,hits[0].distance-0.4);
  // floor plane: keep camera above ground
  if(_camDir.y<-0.001){
    const t=(0.45-_camPivot.y)/_camDir.y;
    if(t>0&&t<blockedDist) blockedDist=t;
  }
  blockedDist=Math.max(1.4,Math.min(wantDist,blockedDist));
  smoothCamDist=THREE.MathUtils.damp(smoothCamDist,blockedDist,10,dt);
  _camFinal.copy(_camPivot).addScaledVector(_camDir,smoothCamDist);
  // spring follow: when something occludes we snap (never clip), otherwise lag
  const occluded=blockedDist<wantDist-0.06;
  if(!camLag._init){ camLag.copy(_camFinal); camLag._init=true; }
  if(occluded) camLag.copy(_camFinal);
  else{
    camLag.x=THREE.MathUtils.damp(camLag.x,_camFinal.x,CAM_LAG_XZ,dt);
    camLag.z=THREE.MathUtils.damp(camLag.z,_camFinal.z,CAM_LAG_XZ,dt);
    camLag.y=THREE.MathUtils.damp(camLag.y,_camFinal.y,CAM_LAG_Y,dt);
  }
  camera.position.copy(camLag);
  if(camera.position.y<0.4) camera.position.y=0.4;
  // combat feedback offsets (shake + directional kick), applied post-collision
  let sx=0,sy=0;
  if(shakeT>0){ shakeT-=dt; const s=shakeAmp*(shakeT>0?shakeT/0.22:0); sx=(Math.random()-0.5)*s; sy=(Math.random()-0.5)*s; if(shakeT<=0) shakeAmp=0; }
  if(kickAmt>0.001){ camera.position.addScaledVector(_camDir,kickAmt); kickAmt*=Math.exp(-9*dt); }
  else kickAmt=0;
  camera.position.x+=sx; camera.position.y+=sy;
  if(camera.position.y<0.35) camera.position.y=0.35;
  // hard safety: combat offsets can never leave the valid camera volume
  camera.position.x=THREE.MathUtils.clamp(camera.position.x,-ARENA/2-1,ARENA/2+1);
  camera.position.z=THREE.MathUtils.clamp(camera.position.z,-ARENA/2-1,ARENA/2+1);
  // FOV punch: momentary widening sells heavy attacks (decays fast, never
  // touches aim because lookAt rotation is unaffected). Gated by shake setting.
  const fov=FOV_BASE+fovKick;
  if(Math.abs(camera.fov-fov)>0.01){ camera.fov=fov; camera.updateProjectionMatrix(); }
  fovKick*=Math.exp(-8*dt); if(fovKick<0.01) fovKick=0;
  camera.lookAt(_camPivot);
}

const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;
  // hit-stop: world slows for an instant on heavy impacts; input+camera stay realtime
  const wdt=hitStopT>0?dt*0.2:dt;
  if(hitStopT>0){ hitStopT-=dt; setStopMix(true); } else if(_wasStopped){ setStopMix(false); _wasStopped=false; }
  if(hitStopT>0) _wasStopped=true;
  // combo idle reset keeps stage tracking consistent (never skips from stale state)
  if(player.combo!==0){ player.comboIdle+=dt; if(player.comboIdle>activeKit().combo.resetTime){ player.combo=0; player.comboIdle=0; } }
  // buffered attack: queued tap fires the moment recovery/cooldown clears
  if(atkBuffer>0){ atkBuffer-=dt; if(atkBuffer<=0){ atkBuffer=0; } else if(atkTimer<=0 && player.atkT<=0){ atkBuffer=0; atkTimer=activeKit().combo.cd; player.atkT=ATK_DUR; player.pendingShot=true; } }
  updatePlayerPhysics(dt);
  animatePlayer(wdt,t);
  animateTargets(wdt,t);
  updateRespawns(wdt);
  updateBurning(wdt,t);
  try{ updateCombatBot(wdt); }catch(e){} // RIVAL brain: strafe/dodge/aim/attack/abilities
  try{ updatePlayerVitals(dt); }catch(e){} // player regen + burn ticks + duel HUD
  updateObstacles(wdt); // crate respawn timers
  updateCamera(dt);
  updateAimAssist();
  updateProjectiles(wdt);
  updateVolley(wdt);
  updateSpin(wdt);
  updateLaser(wdt);
  // Beam-clash safety net: if the player beam died without updateLaser running
  // (respawn / rig swap / cancel race), resolve the clash here so no enemy beam
  // or particle ever lingers. Also ticks the re-arm cooldown while idle.
  try{ if(!AB.laser.holding && typeof updateBeamClash==='function') updateBeamClash(wdt); }catch(e){}
  updateFlight(wdt);
  updateFireballs(wdt);
  updatePyroShots(wdt);
  updateFlame(wdt);
  updateFlameJets(wdt);
  if(player.landing && !player.flying){ // touchdown glide after flight ends
    const landGround=groundHeightAt(player.pos.x,player.pos.z);
    player.flyH=THREE.MathUtils.damp(player.flyH,landGround,6,wdt);
    if(player.flyH<landGround+0.05){ player.flyH=landGround; player.landing=false; player.grounded=true; player.vy=0; player.landT=0.3; SFX.touchdown(); camKick(0.08); }
  }
  updateBeams(wdt);
  if(boomLightT>0){ boomLightT-=wdt; if(boomLightT<=0) boomLight.intensity=0; }
  updateExplosions(wdt);
  updatePhoenixFury(wdt);
  updatePhoenixInput(wdt);
  updatePhoenixDive(wdt);
  updatePhoenixTornado(wdt);
  updatePhoenixCharge(wdt);
  updateCooldownUI(dt);
  updateDamageNumbers(wdt);
  updateScreenFlash(dt);
  renderer.render(scene,camera);
}
loop();
</script>
