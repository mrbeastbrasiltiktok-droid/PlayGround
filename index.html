<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>Stickman Rivals — 3D Combat Prototype</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#9fd0ef;font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;touch-action:none;overscroll-behavior:none}
  #game-canvas{position:fixed;inset:0;display:block}
  /* Rotate hint */
  #rotate-hint{display:none;position:fixed;inset:0;z-index:200;background:rgba(10,15,25,.92);color:#fff;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-size:18px;text-align:center;padding:20px}
  @media (orientation:portrait) and (max-width:700px){
    #rotate-hint{display:flex}
  }
  /* Reticle — single minimal white dot (position set by aiming mode) */
  #reticle{position:fixed;left:58%;top:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:20}
  #aim-dot{width:8px;height:8px;background:#fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.55),0 0 5px rgba(0,0,0,.5);transition:transform .08s ease,background .08s ease}
  #reticle.hit #aim-dot{transform:scale(2.1);background:#ffd23f}
  /* Hitmarker — brief X flash at the reticle on confirmed hits (never blocks view) */
  #hitmarker{position:fixed;left:58%;top:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:20;opacity:0;width:26px;height:26px}
  #hitmarker i{position:absolute;left:50%;top:50%;width:9px;height:2px;background:#fff;box-shadow:0 0 4px rgba(0,0,0,.8)}
  #hitmarker i:nth-child(1){transform:translate(-130%,-130%) rotate(45deg)}
  #hitmarker i:nth-child(2){transform:translate(30%,-130%) rotate(-45deg)}
  #hitmarker i:nth-child(3){transform:translate(-130%,30%) rotate(-45deg)}
  #hitmarker i:nth-child(4){transform:translate(30%,30%) rotate(45deg)}
  #hitmarker.show{opacity:1}
  #hitmarker.kill i{background:#ff5252;height:3px}
  /* Aim lock marker — four clean white corners only, no center dot */
  #lock-marker{position:fixed;left:0;top:0;width:84px;height:84px;margin:-42px 0 0 -42px;pointer-events:none;z-index:21;display:none;transition:opacity .15s}
  .lock-corner{position:absolute;width:20px;height:20px;border:2px solid rgba(255,255,255,.95);filter:drop-shadow(0 1px 2px rgba(0,0,0,.8))}
  .lc-tl{left:0;top:0;border-right:none;border-bottom:none;border-radius:6px 0 0 0}
  .lc-tr{right:0;top:0;border-left:none;border-bottom:none;border-radius:0 6px 0 0}
  .lc-bl{left:0;bottom:0;border-right:none;border-top:none;border-radius:0 0 0 6px}
  .lc-br{right:0;bottom:0;border-left:none;border-top:none;border-radius:0 0 6px 0}
  /* Top bar */
  #topbar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:center;align-items:center;padding:10px;z-index:30;pointer-events:none}
  #kill-counter{background:rgba(0,0,0,.45);color:#fff;padding:6px 16px;border-radius:20px;font-weight:700;font-size:14px;letter-spacing:.5px;backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.2)}
  #settings-btn{position:fixed;top:10px;right:12px;z-index:40;width:48px;height:48px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(15,20,30,.65);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(6px);transition:transform .12s}
  #settings-btn:active{transform:scale(1.15)}
  #fs-btn{position:fixed;top:10px;left:12px;z-index:40;height:40px;padding:0 14px;border-radius:20px;border:1px solid rgba(255,255,255,.5);background:rgba(15,20,30,.55);color:#fff;font-size:13px;font-weight:700;cursor:pointer}
  /* Joystick */
  #joystick{position:fixed;left:22px;bottom:22px;width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.45);z-index:30;backdrop-filter:blur(3px);touch-action:none}
  #joy-knob{position:absolute;left:50%;top:50%;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(0,0,0,.35);transform:translate(-50%,-50%);transition:transform .05s linear}
  /* Combat cluster — premium dark-metal HUD, Marvel-Rivals clarity */
  #combat-cluster{position:fixed;right:12px;bottom:12px;width:260px;height:230px;z-index:30;pointer-events:none;--gold:#ffd23f}
  .abtn{position:absolute;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:800;cursor:pointer;pointer-events:auto;overflow:hidden;touch-action:none;
    background:linear-gradient(160deg,#2b3038 0%,#171a1f 55%,#0e1114 100%);
    border:2px solid #454c56;color:#dfe3e8;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -3px 6px rgba(0,0,0,.5),0 4px 14px rgba(0,0,0,.45);
    transition:transform .1s ease,box-shadow .15s ease,border-color .15s ease,filter .15s ease}
  .abtn svg{display:block;pointer-events:none}
  .abtn .blabel{font-size:8px;font-weight:800;letter-spacing:1.4px;color:#9aa1ab;pointer-events:none;line-height:1}
  .abtn.pressed{transform:scale(.9)!important;filter:brightness(1.35)}
  .abtn.fired{border-color:var(--gold);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 12px rgba(255,210,63,.55)}
  .abtn.ready-pop{animation:readypop .28s ease}
  @keyframes readypop{0%{box-shadow:0 0 0 0 rgba(255,210,63,.7)}100%{box-shadow:0 0 0 10px rgba(255,210,63,0)}}
  .abtn .cd-overlay{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;pointer-events:none;
    background:conic-gradient(rgba(4,6,9,.82) calc(var(--cd,0)*1turn), rgba(4,6,9,.12) 0)}
  .abtn .cd-text{font-size:13px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000;display:none}
  .abtn.on-cd .cd-text{display:block}
  .abtn.on-cd{filter:saturate(.6) brightness(.85)}
  .abtn.ability-active{border-color:var(--acc,#ffe14d);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 0 0 2px var(--acc,#ffe14d),0 0 14px var(--acc,#ffe14d)}
  .abtn.ability-active .blabel{color:var(--acc,#ffe14d)}
  .abtn.disabled{opacity:.42;filter:grayscale(.75)}
  #btn-attack{left:148px;top:118px;width:108px;height:108px;border-color:#6b5a17;color:var(--gold)}
  #btn-attack svg{width:34px;height:34px}
  #btn-attack .blabel{color:var(--gold);font-size:9px}
  #btn-attack .pips{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none}
  #btn-attack .pips i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.22);border:1px solid rgba(255,210,63,.5)}
  #btn-attack .pips i.on{background:var(--gold);box-shadow:0 0 6px rgba(255,210,63,.9)}
  #btn-attack .pips i.big{width:9px;height:9px}
  #btn-attack{box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -4px 8px rgba(0,0,0,.55),0 0 0 1px #000,0 4px 16px rgba(0,0,0,.5)}
  .ability{--acc:#8b93a1;width:60px;height:60px}
  .ability svg{width:24px;height:24px}
  #ab1{--acc:#7cc4ff;left:72px;top:142px}
  #ab2{--acc:#f0a35e;left:92px;top:82px}
  #ab3{--acc:#ff7a7a;left:144px;top:46px}
  #ab4{--acc:#9fe870;left:204px;top:47px}
  .ability .blabel{color:var(--acc)}
  /* Damage numbers + healthbars handled in 3D + HTML */
  #dmg-layer{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}
  .dmg-num{position:absolute;font-weight:900;font-size:22px;color:#ffeb3b;text-shadow:0 0 6px #ff5722,0 2px 2px #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;transform:translate(-50%,-50%);will-change:transform,opacity;white-space:nowrap}
  .dmg-num.crit{color:#ff5252;font-size:27px}
  /* Settings panel — compact dark charcoal, pro game UI */
  #settings-panel{position:fixed;top:64px;right:10px;width:min(300px,92vw);max-height:82vh;overflow-y:auto;background:#1c1e22;color:#d7dae0;border:1px solid #34373e;border-radius:10px;padding:12px 12px 10px;z-index:60;display:none;box-shadow:0 12px 32px rgba(0,0,0,.55)}
  #settings-panel.open{display:block}
  #settings-panel h2{font-size:12px;font-weight:700;margin:0 0 4px;text-align:left;letter-spacing:1.2px;text-transform:uppercase;color:#9aa0aa}
  .srow{margin:0;padding:9px 2px;border-bottom:1px solid #2a2d33}
  .srow:last-of-type{border-bottom:none}
  .srow label{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:600;margin-bottom:6px;color:#cfd3da}
  .srow label span.val{color:#e8eaee;font-weight:700;font-size:12px}
  input[type=range]{width:100%;accent-color:#9aa3af;height:22px}
  .toggle-row{display:flex;justify-content:space-between;align-items:center}
  .toggle{width:40px;height:22px;border-radius:11px;background:#3a3d44;position:relative;cursor:pointer;transition:background .18s;flex-shrink:0;border:1px solid #4a4e57}
  .toggle.on{background:#6f8200;border-color:#6f8200}
  .toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:left .18s}
  .toggle.on::after{left:20px}
  .qbtns{display:flex;gap:6px}
  .qbtns button{flex:1;padding:7px 0;border-radius:6px;border:1px solid #3a3d44;background:#24262c;color:#cfd3da;font-weight:700;font-size:12px;cursor:pointer;transition:background .15s}
  .qbtns button.active{background:#33363d;border-color:#6f8200;color:#fff}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;padding:7px 4px;border-radius:6px;border:1px solid #3a3d44;background:#24262c;color:#cfd3da;font-weight:700;font-size:11.5px;cursor:pointer}
  .seg button.active{background:#33363d;border-color:#6f8200;color:#fff}
  #reset-sens{width:100%;margin-top:6px;padding:7px;border-radius:6px;border:1px solid #3a3d44;background:#24262c;color:#cfd3da;font-weight:700;font-size:12px;cursor:pointer}
  #close-settings{width:100%;margin:8px 0 2px;padding:9px;border-radius:6px;border:none;background:#e8eaee;color:#1c1e22;font-weight:800;cursor:pointer;font-size:13px}
  #toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;padding:10px 18px;border-radius:24px;font-weight:800;z-index:70;display:none;font-size:15px}
  #hit-vignette{position:fixed;inset:0;pointer-events:none;z-index:15;background:radial-gradient(ellipse at center,transparent 62%,rgba(255,30,30,.35) 100%);opacity:0;transition:opacity .15s}
  #power-flash{position:fixed;inset:0;pointer-events:none;z-index:14;opacity:0}
  /* Character select */
  #char-btn{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:40;height:40px;padding:0 16px;border-radius:20px;border:1px solid rgba(255,255,255,.5);background:rgba(15,20,30,.55);color:#fff;font-size:12px;font-weight:800;letter-spacing:1px;cursor:pointer}
  #char-panel{position:fixed;top:60px;left:50%;transform:translateX(-50%);width:min(280px,90vw);background:#1c1e22;color:#d7dae0;border:1px solid #34373e;border-radius:10px;padding:14px;z-index:65;display:none;box-shadow:0 12px 32px rgba(0,0,0,.55);text-align:center}
  #char-panel.open{display:block}
  #char-panel h3{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:#9aa0aa;margin-bottom:10px}
  #char-preview{display:flex;justify-content:center;margin-bottom:8px}
  #char-name{font-size:16px;font-weight:800;letter-spacing:2px;color:#fff;margin-bottom:2px}
  #char-desc{font-size:11.5px;color:#9aa0aa;margin-bottom:10px}
  #char-select{width:100%;padding:9px;border-radius:6px;border:none;background:#e8eaee;color:#1c1e22;font-weight:800;font-size:13px;cursor:pointer}
  #char-select.selected{background:#6f8200;color:#fff}
  /* Flight altitude buttons (visible only while flying) */
  #fly-alt{position:fixed;left:170px;bottom:30px;z-index:31;display:none;flex-direction:column;gap:10px}
  #fly-alt.show{display:flex}
  #fly-alt button{width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,.85);background:rgba(20,24,32,.7);color:#fff;font-size:20px;font-weight:800;touch-action:none}
  /* Active ability state (legacy hook, superseded by per-button --acc above) */
  .abtn.ability-active{border-color:var(--acc,#ffe14d)}
</style>

<body>
<canvas id="game-canvas"></canvas>
<div id="hit-vignette"></div>
<div id="power-flash"></div>
<div id="reticle"><div id="aim-dot"></div></div>
<div id="hitmarker"><i></i><i></i><i></i><i></i></div>
<div id="lock-marker"><div class="lock-corner lc-tl"></div><div class="lock-corner lc-tr"></div><div class="lock-corner lc-bl"></div><div class="lock-corner lc-br"></div></div>
<div id="dmg-layer"></div>
<div id="topbar"><div id="kill-counter">TARGETS: 3</div></div>
<button id="fs-btn">⛶ FULLSCREEN</button>
<button id="char-btn" title="Character">◉ CHARACTER</button>
<div id="settings-btn" title="Settings">⚙</div>
<div id="joystick"><div id="joy-knob"></div></div>
<div id="fly-alt"><button id="fly-up" title="Ascend">▲</button><button id="fly-down" title="Descend">▼</button></div>
<div id="combat-cluster">
  <div id="ab4" class="abtn ability" title="Flight"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 13.5-7-2.8-7 2.8L12 3z"/><path d="M12 3v7"/><path d="M4.5 18.5L3 21M19.5 18.5L21 21"/></svg><span class="blabel">FLY</span><div class="cd-overlay"><span class="cd-text"></span></div></div>
  <div id="ab3" class="abtn ability" title="Dual-Hand Laser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5l8.5 4M3 17.5l8.5-4M11.5 10.5H20"/><circle cx="20.5" cy="10.5" r="1.5" fill="currentColor" stroke="none"/></svg><span class="blabel">BEAM</span><div class="cd-overlay"><span class="cd-text"></span></div></div>
  <div id="ab2" class="abtn ability" title="Missile Volley"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 19V10M6 10l-2 2M6 10l2 2M12 21V6M12 6l-2.4 2.4M12 6l2.4 2.4M18 19v-9M18 10l-2 2M18 10l2 2"/></svg><span class="blabel">VOLLEY</span><div class="cd-overlay"><span class="cd-text"></span></div></div>
  <div id="ab1" class="abtn ability" title="Repulsor Spin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M17.5 2.8v3.6h-3.6"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg><span class="blabel">SPIN</span><div class="cd-overlay"><span class="cd-text"></span></div></div>

</div>
<div id="char-panel">
  <h3>Character Select</h3>

  <button id="char-select">SELECT IRONMAN</button>
</div>
<div id="rotate-hint"><div style="font-size:44px">🔄</div><div>Rotate to <b>landscape</b> for best experience</div><button id="fs-btn2" style="padding:12px 26px;border-radius:24px;border:none;background:#7CB342;font-weight:900">TAP FOR FULLSCREEN</button></div>

  <h2>Settings</h2>
  <div class="srow"><label><span>◎ Target count</span><span class="val" id="v-targets">3</span></label><input id="s-targets" type="range" min="1" max="8" step="1" value="3"></div>

<div id="toast"></div>
<script type="module">
import * as THREE from 'three';

/* ============ SETTINGS STATE ============ */
const Settings = { targetCount:3, aimAssist:true, aimingMode:'right', sensitivity:1.2, volume:0.7, shake:true, quality:'medium', character:'none', rigType:'r15' };
try{ const sr=localStorage.getItem('stickman-rig'); if(sr==='r6'||sr==='r15') Settings.rigType=sr; }catch(e){}
const DEFAULT_SENS = 1.2;
// Central graphics-quality controller: every visual system reads from Q().
const QUALITY = {
  low:{ pixelRatio:1, particles:8, trail:8, shadow:false, shadowSize:512, blob:0.34,
        trailRate:0.25, boomScale:0.8, smokeRate:0.2, beamWidth:0.7, thrustRate:0.3, flashLight:false, boomLight:false },
  medium:{ pixelRatio:Math.min(devicePixelRatio,1.5), particles:20, trail:22, shadow:true, shadowSize:1024, blob:0.27,
        trailRate:0.55, boomScale:1.0, smokeRate:0.5, beamWidth:1.0, thrustRate:0.6, flashLight:true, boomLight:true },
  high:{ pixelRatio:Math.min(devicePixelRatio,2), particles:42, trail:40, shadow:true, shadowSize:2048, blob:0.22,
        trailRate:0.85, boomScale:1.25, smokeRate:0.9, beamWidth:1.3, thrustRate:1.0, flashLight:true, boomLight:true }
};
function Q(){ return QUALITY[Settings.quality]; }

/* ============ AUDIO (procedural WebAudio, mastered mix bus) ============
   Master chain: sources -> sfxGain -> duckGain -> compressor -> destination.
   The compressor is the safety limiter (prevents clipping when volleys, spin
   zaps and explosions overlap); duckGain carries transient ducking (sustained
   laser/flight hums sit in the mix) and hit-stop dilation (world slows, mix
   tightens momentarily so impacts land harder). */
let audioCtx=null, masterGain=null, duckGain=null;
function ensureAudio(){
  if(audioCtx) return;
  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    masterGain=audioCtx.createGain(); masterGain.gain.value=Settings.volume;
    duckGain=audioCtx.createGain(); duckGain.gain.value=1;
    const comp=audioCtx.createDynamicsCompressor();
    comp.threshold.value=-9; comp.knee.value=16; comp.ratio.value=9; comp.attack.value=0.003; comp.release.value=0.16;
    masterGain.connect(duckGain); duckGain.connect(comp); comp.connect(audioCtx.destination);
  }catch(e){}
}
function setVolume(v){ Settings.volume=v; if(masterGain) masterGain.gain.value=v; }
// Transient duck for sustained layers: dip the bus briefly when a new bed starts.
function duckBus(amt=0.55,hold=0.09){
  if(!audioCtx||!duckGain) return;
  const t=audioCtx.currentTime;
  duckGain.gain.cancelScheduledValues(t);
  duckGain.gain.setTargetAtTime(amt,t,0.02);
  duckGain.gain.setTargetAtTime(1,t+hold,0.09);
}
// Hit-stop response: tighten the mix for the freeze window (called per frame).
function setStopMix(on){

/* R15 — 15 articulated segments: head, upper/lower torso, upper/lower arms,

function buildR15(color){

  const lowerTorso=mesh(new THREE.CapsuleGeometry(0.11,0.16,4,10),0,0.06,0,hips); // LOWER TORSO

    const hp=new THREE.Group(); hp.position.set(0.10*side,HIP_H-0.02,0); g.add(hp);
    mesh(JB,0,0,0,hp);
    mesh(new THREE.CapsuleGeometry(0.064,0.26,3,10),0,-0.16,0,hp);           // UPPER LEG
    const kn=new THREE.Group(); kn.position.y=-0.38; hp.add(kn);

/* Burning status — shared by every fire source. Timers live on the target so
   damage continues after the originating projectile/effect is gone. Rules:
   controlled tick interval (never per-frame), capped duration, and refresh
   (extend, capped) rather than unlimited stacking. */
const BURN = { tick:0.45, dur:3.2, maxDur:6.4, dmg:3.4 };
function applyBurn(t, opts={}){
  if(!t || !t.alive) return;
  const dmg=opts.dmg ?? BURN.dmg;
  const dur=opts.dur ?? BURN.dur;
  const tick=opts.tick ?? BURN.tick;
  if(t.burn){
    // REFRESH rule: extend toward cap, keep the strongest per-tick damage
    t.burn.t=Math.min(BURN.maxDur, t.burn.t+dur*0.6);
    t.burn.dmg=Math.max(t.burn.dmg,dmg);
    t.burn.next=Math.min(t.burn.next,tick);
    return;
  }
  t.burn={ t:dur, tick, dmg, next:tick };
  ensureBurnAura(t);
}
function ensureBurnAura(t){
  if(t.burnAura) return;
  const grp=new THREE.Group(); grp.position.y=1.15; grp.visible=false; t.rig.group.add(grp);
  const q=Q();
  const parts=[];
  const n=q===QUALITY.low?2:(q===QUALITY.medium?4:6);
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2;
    const m=new THREE.Mesh(new THREE.SphereGeometry(0.16,7,6),
      new THREE.MeshBasicMaterial({color:i%3===0?0xfff2b0:0xff7a1e,transparent:true,opacity:0.85,blending:THREE.AdditiveBlending,depthWrite:false}));
    m.position.set(Math.cos(a)*0.34,Math.random()*0.45-0.1,Math.sin(a)*0.34);
    grp.add(m); parts.push({m,base:m.position.y,ph:Math.random()*6.28});
  }
  t.burnAura={grp,parts,tick:0};
}
function updateBurnAura(t,dt,time){
  const a=t.burnAura; if(!a) return;
  const on=t.alive && t.burn && t.burn.t>0;
  a.grp.visible=on; if(!on) return;
  a.tick-=dt;
  if(a.tick<=0){ // ember sparks shedding from the burning body
    a.tick=0.09;
    const pm=fxSpawn(fireEmberGeo,0xffd24a,true,0.9);
    if(pm){ pm.position.copy(t.rig.group.position); pm.position.y+=0.9+Math.random()*1.1; pm.position.x+=(Math.random()-0.5)*0.5; pm.position.z+=(Math.random()-0.5)*0.5;
      explosions.push({flash:pm,parts:[],ringM:null,life:0,dur:0.55}); }
  }
  for(const p of a.parts){
    const s=0.7+0.45*Math.sin(time*9+p.ph);
    p.m.scale.set(s,s*1.35,s);
    p.m.position.y=p.base+((time*0.9+p.ph)%1)*0.5;
  }
}
function updateBurning(dt,time){

    if(!t.burn || !t.alive) continue;
    t.burn.t-=dt;
    if(t.burn.t<=0){ t.burn=null; continue; }
    t.burn.next-=dt;
    if(t.burn.next<=0){

}

/* ---- VERTICAL PHYSICS: gravity, jump, coyote, landing ----
   Shared by ground locomotion and flight: flight overrides gravity with its own
   climb integration, and releasing flight mid-air resumes falling naturally. */
const GRAVITY=22, JUMP_VEL=8.6, COYOTE=0.12;
let jumpPressed=false;
function tryJump(){
  if(player.flying){ // flight already owns vertical movement; drop altitude instead
    return;
  }
  if(player.atkT>0||AB.spin.t>0) return; // no jump mid-attack/spin: keeps commitments clean
  if(player.coyoteT>0){
    player.vy=JUMP_VEL; player.grounded=false; player.coyoteT=0; player.jumpT=0.28; player.airT=0;
    SFX.jump(); triggerShake(0.05,0.1); camKick(0.05);
  }
}
function updatePlayerPhysics(dt){
  if(player.flying){
    // flight height integration lives in updateFlight(); keep ground state parked
    player.grounded=false; player.vy=0; player.coyoteT=0; return;
  }
  if(player.grounded){
    player.coyoteT=COYOTE;
    player.jumpT=Math.max(0,player.jumpT-dt);
    player.landT=Math.max(0,player.landT-dt*1.6);
    return;
  }
  // airborne: integrate gravity with a short apex hang for weight
  player.airT+=dt;
  player.jumpT=Math.max(0,player.jumpT-dt);
  const hang=Math.abs(player.vy)<2.2?0.72:1; // reduced gravity near apex
  player.vy-=GRAVITY*hang*dt;
  player.flyH+=player.vy*dt;
  player.lastFallSpeed=Math.max(player.lastFallSpeed,-player.vy);
  if(player.flyH<=0){
    player.flyH=0; player.vy=0; player.grounded=true;
    const hard=player.lastFallSpeed>9;
    player.landT=hard?1:0.55;
    player.lastFallSpeed=0;
    SFX.land(hard);
    triggerShake(hard?0.22:0.08,hard?0.22:0.12);
    camKick(hard?0.1:0.04);
    landingDust();
  }
  player.coyoteT=Math.max(0,player.coyoteT-dt);
}
function landingDust(){
  const q=Q(); if(Settings.quality==='low') return;
  const entry={flash:null,parts:[],ringM:null,life:0,dur:0.45};
  explosions.push(entry);
  if(!gate('dust',120)) return;
  for(let i=0;i<6;i++){
    const pm=fxSpawn(smokeGeo,0xcfd4da,false,0.45);
    if(!pm) break;
    pm.position.set(player.pos.x+(Math.random()-0.5)*0.6,0.08,player.pos.z+(Math.random()-0.5)*0.6);
    pm.scale.setScalar(0.45);
    const v=new THREE.Vector3((Math.random()-0.5)*2.4,0.7+Math.random()*0.9,(Math.random()-0.5)*2.4);
    entry.parts.push({m:pm,v,life:0,dur:0.45});
  }
}

function handWorldPos(){ const v=new THREE.Vector3(); playerRig.handR.getWorldPosition(v); return v; }
// Precise world-space point indicated by the camera ray through the aim dot:
// nearest target hit, else ground-plane hit, else far point along the ray.
function computeAimPoint(maxDist=90){
  const ray=aimRay();
  let bestT=maxDist, bestPoint=null;
  for(const t of targets){ if(!t.alive) continue;
    const c=t.rig.group.position.clone(); c.y=1.3;
    const toC=c.clone().sub(ray.origin); const tProj=toC.dot(ray.direction);
    if(tProj<1||tProj>maxDist) continue;
    const closest=ray.origin.clone().addScaledVector(ray.direction,tProj);
    if(closest.distanceTo(c)<1.0 && tProj<bestT){ bestT=tProj; bestPoint=closest; }
  }
  if(bestPoint) return bestPoint;
  if(ray.intersectPlane(groundPlane,_hitP) && ray.origin.distanceTo(_hitP)<maxDist) return _hitP.clone();
  return ray.origin.clone().addScaledVector(ray.direction,maxDist);
}

const mslNoseMat=new THREE.MeshStandardMaterial({color:0xd84a30, roughness:0.5});

/* Transient FX mesh pool: recycles short-lived additive/transparent spheres
   (smoke, sparks, thrust, palm parts) instead of allocating materials + meshes
   every frame. Quality caps total live pooled meshes; acquire fails past cap. */
const fxPool=[];
const FXCAP={low:60,medium:120,high:220};
let fxAlive=0;
function fxSpawn(geo,color,additive,op){
  for(const m of fxPool){
    if(!m.visible && m.userData.geo===geo && m.userData.color===color && m.userData.add===additive){
      m.visible=true; fxAlive++;
      m.material.opacity=op; m.scale.set(1,1,1); m.rotation.set(0,0,0);
      return m;
    }
  }
  if(fxAlive>=FXCAP[Settings.quality]) return null;
  const mat=new THREE.MeshBasicMaterial({color,transparent:true,opacity:op,
    blending:additive?THREE.AdditiveBlending:THREE.NormalBlending,depthWrite:false});
  const m=new THREE.Mesh(geo,mat);
  m.userData={geo,color,add:additive,pooled:true}; m.visible=true;
  scene.add(m); fxPool.push(m); fxAlive++;
  return m;
}
function fxKill(m){ if(!m||!m.visible) return; m.visible=false; fxAlive=Math.max(0,fxAlive-1); }
function fxFree(m){ if(m&&m.userData&&m.userData.pooled) fxKill(m); else if(m) scene.remove(m); }
function buildMissileMesh(withLight=true){
  const g=new THREE.Group();
  const body=new THREE.Mesh(mslBodyGeo,mslBodyMat); body.castShadow=false; g.add(body);
  const nose=new THREE.Mesh(mslNoseGeo,mslNoseMat); nose.position.y=0.36; g.add(nose);
  const flame=new THREE.Mesh(mslFlameGeo,mslFlameMat.clone()); flame.position.y=-0.38; flame.rotation.x=Math.PI; g.add(flame);
  if(withLight && Q().flashLight){ const l=new THREE.PointLight(0xffa030,5,8); l.position.y=-0.2; g.add(l); }
  return {group:g, flame};
}
function orientAlong(group, vel){ const d=vel.clone().normalize(); group.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d); }
function fireMissile(dir, homingTarget, startPos, opts={}){
  const {dmg=22, radius=2.2, big=false, speed=34, agile=false}=opts;
  const {group, flame}=buildMissileMesh();
  group.position.copy(startPos);
  scene.add(group);
  orientAlong(group, dir);
  projectiles.push({mesh:group, flame, vel:dir.clone().multiplyScalar(speed), life:0, maxRange:95,
    traveled:0, target:homingTarget||null, dmg, radius, big, agile, smokeT:0, hitDone:false, trailMeshes:[]});
  SFX.missile();
  triggerShake(0.10,0.10);
}
function explodeMissile(pos, dmg, radius, big, sizeMult=1, kick=1){
  const q=Q(), s=q.boomScale*(big?1.35:1.0)*sizeMult;
  const flash=new THREE.Mesh(new THREE.SphereGeometry(0.5*s,14,12), new THREE.MeshBasicMaterial({color:0xffd76e,transparent:true,opacity:0.95}));
  flash.position.copy(pos); scene.add(flash);
  const n=Math.round(q.particles*(big?1.6:1.0)*sizeMult);
  const parts=[];
  for(let i=0;i<n;i++){
    const col=Math.random()<0.45?0xff7a1a:(Math.random()<0.5?0xffd76e:0x888888);
    const pm=fxSpawn(smokeGeo,col,false,1);
    if(!pm) break;
    pm.position.copy(pos); pm.scale.setScalar(s);
    const v=new THREE.Vector3((Math.random()-0.5),Math.random()*0.9+0.15,(Math.random()-0.5)).normalize().multiplyScalar((4+Math.random()*8)*s);
    parts.push({m:pm,v,life:0,dur:(0.4+Math.random()*0.35)*(q===QUALITY.low?0.7:1)});
  }
  let ringM=null;
  if(Settings.quality!=='low'){ ringM=new THREE.Mesh(new THREE.RingGeometry(0.3*s,0.65*s,28), new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.9,side:THREE.DoubleSide})); ringM.position.copy(pos); ringM.lookAt(camera.position); scene.add(ringM); }
  explosions.push({flash,parts,ringM,life:0,dur:0.55});
  if(q.boomLight){ /* flash light via shared temp light */ pulseLight(pos, big?8:5); }
  // Real gameplay AoE: damage every valid target in radius (never the player)
  if(dmg>0){
    for(const t of targets){
      if(!t.alive) continue;
      const c=t.rig.group.position.clone(); c.y=1.2;
      if(c.distanceTo(pos)<=radius+0.6){
        applyDamage(t, dmg, pos.clone(), kick);
        if(big) t.ragdollT=0.7; // brief ragdoll, auto-recovers in animateTargets
      }
    }
    damageObstacles(pos,radius,dmg); // blasts also chew through breakable crates
    // impact emphasis: tiny hit-stop + screen pulse scale with significance
    hitStop(big?0.07:0.025);
    screenPulse('255,170,70',big?0.26:0.15,big?0.3:0.2);
  }
  SFX.explosion(distVol(pos)); SFX.impact();
  triggerShake(big?0.3:0.2,0.22);
  camKick(big?0.16:0.07);
  hitVignette();
}
// Shared reusable flash light (avoids per-explosion light allocation)
const boomLight=new THREE.PointLight(0xffa040,0,18); scene.add(boomLight);
let boomLightT=0;
function pulseLight(pos,i){ boomLight.position.copy(pos); boomLight.position.y+=0.5; boomLight.intensity=i; boomLightT=0.25; }
function destroyProj(i){ const p=projectiles[i]; scene.remove(p.mesh); p.trailMeshes.forEach(t=>fxKill(t.m)); projectiles.splice(i,1); }
function missileHitsTarget(pos){
  for(const t of targets){ if(!t.alive) continue;
    const tp=t.rig.group.position; const dx=pos.x-tp.x, dz=pos.z-tp.z, dy=pos.y-1.2;
    if(dx*dx+dz*dz<1.2 && Math.abs(dy)<1.7){ return t; }
  }
  return null;
}
function updateProjectiles(dt){
  const q=Q();
  for(let i=projectiles.length-1;i>=0;i--){ const p=projectiles[i];
    if(p.target && p.target.alive && Settings.aimAssist){
      const tp=p.target.rig.group.position.clone(); tp.y=1.35;
      const desired=tp.sub(p.mesh.position).normalize().multiplyScalar(p.vel.length());
      p.vel.lerp(desired, Math.min(1,dt*(p.agile?10:7)));
    }
    const step=p.vel.clone().multiplyScalar(dt);
    p.mesh.position.add(step); p.traveled+=step.length(); p.life+=dt;
    orientAlong(p.mesh, p.vel);
    p.flame.scale.set(1,0.8+Math.random()*0.6,1);
    // smoke trail (quality-scaled rate, pooled meshes)
    p.smokeT-=dt;
    if(p.smokeT<=0 && Math.random()<q.smokeRate){
      p.smokeT=0.05;
      const tm=fxSpawn(smokeGeo,0xcccccc,false,0.55);
      if(tm){ tm.position.copy(p.mesh.position); p.trailMeshes.push({m:tm,life:0}); }
      if(p.trailMeshes.length>q.trail){ const old=p.trailMeshes.shift(); fxKill(old.m); }
    }
    for(let j=p.trailMeshes.length-1;j>=0;j--){ const tr=p.trailMeshes[j]; tr.life+=dt; tr.m.material.opacity=Math.max(0,0.55-tr.life*1.8); tr.m.scale.multiplyScalar(1+dt*1.5); if(tr.life>0.4){ fxKill(tr.m); p.trailMeshes.splice(j,1);} }
    const mp=p.mesh.position;
    const hit=missileHitsTarget(mp);
    const hitWall=Math.abs(mp.x)>PLAY_HALF+0.4||Math.abs(mp.z)>PLAY_HALF+0.4;
    const hitCover=!hit && pointInObstacles(mp); // structures detonate missiles too
    if(hit && !p.hitDone){ p.hitDone=true; explodeMissile(mp.clone(),p.dmg,p.radius,p.big); destroyProj(i); }
    else if(!hit && (mp.y<0.12||hitWall||hitCover||mp.y>40)){ explodeMissile(mp.clone(),hitCover?p.dmg:0,p.radius,p.big); destroyProj(i); }
    else if(p.traveled>p.maxRange||p.life>4){ explodeMissile(mp.clone(),0,p.radius,false); destroyProj(i); }
  }
}
function updateExplosions(dt){
  for(let i=explosions.length-1;i>=0;i--){ const e=explosions[i]; e.life+=dt; const k=e.life/e.dur;
    if(k>=1){ fxFree(e.flash); if(e.ringM) scene.remove(e.ringM); e.parts.forEach(p=>fxFree(p.m)); explosions.splice(i,1); continue; }
    e.flash.scale.setScalar(1+k*3.2); e.flash.material.opacity=0.95*(1-k);
    if(e.ringM){ e.ringM.scale.setScalar(1+k*4); e.ringM.material.opacity=0.9*(1-k); }
    for(const p of e.parts){ p.life+=dt; p.v.y-=dt*12; p.m.position.addScaledVector(p.v,dt); p.m.material.opacity=Math.max(0,1-p.life/p.dur); if(p.m.position.y<0.05){p.m.position.y=0.05;p.v.y*=-0.4;} }
  }
}
function flashBtn(i){ // brief synergy-feedback flash on an ability button
  const b=abBtns[i]; if(!b) return;
  b.classList.add('fired'); setTimeout(()=>b.classList.remove('fired'),320);
}
function applyDamage(t, dmg, at, kick=1, src=null){
  if(!t.alive) return;
  t.health-=dmg; t.flash=Math.min(1.5,kick); t.recoil=Math.min(1.5,kick);
  // red flash handled in update; recoil lean scales with kick, always recovers
  const wp=t.rig.group.position.clone(); wp.y=2.3;
  spawnDamageNumber(wp,dmg,dmg>28);
  updateHealthBar(t);
  SFX.hit();
  // TIERED HIT CONFIRMATION: light ticks ping the reticle, kills flash red.
  // Heavy sources (stage-3, volley direct) already shake via explodeMissile.
  const killed=t.health<=0;
  try{ pulseHitmarker(killed); }catch(e){}
  if(killed) SFX.hitmarkerKill(); else SFX.hitmarker();
  if(src==='spin' || src==='laser'){ triggerShake(0.05,0.08); }
  if(t.health<=0){ t.alive=false; t.health=0; t.respawnT=RESPAWN_DELAY; updateHealthBar(t);
    // death: fall over, then respawn after a few seconds at a new valid spot
    toast('TARGET DOWN!'); updateKillCounter();
    // SYNERGY focus payoff: a laser kill refunds volley cooldown (focused pressure rewarded)
    if(src==='laser'){ AB.volley.cd=Math.max(0,AB.volley.cd-activeKit().synergy.laserKillVolleyRefund); flashBtn(1); }
    if(lockedTarget===t) clearLock();
  }
}

/* ============ INPUT: joystick + camera drag + keyboard (desktop validation) ============ */
const joy={x:0,y:0,active:false,id:null};
const keys={w:false,a:false,s:false,d:false,e:false,q:false}; // desktop WASD override, merges when stick idle
const joyEl=document.getElementById('joystick'), knob=document.getElementById('joy-knob');
function joyHandle(e){ const r=joyEl.getBoundingClientRect(); const cx=r.left+r.width/2, cy=r.top+r.height/2;
  let dx=e.clientX-cx, dy=e.clientY-cy; const max=r.width/2-10; const len=Math.hypot(dx,dy);
  if(len>max){ dx*=max/len; dy*=max/len; }
  knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
  joy.x=dx/max; joy.y=dy/max;
}
joyEl.addEventListener('pointerdown',e=>{ ensureAudio(); joy.active=true; joy.id=e.pointerId; joyEl.setPointerCapture(e.pointerId); joyHandle(e); });
joyEl.addEventListener('pointermove',e=>{ if(joy.active&&e.pointerId===joy.id) joyHandle(e); });
function joyEnd(e){ if(e.pointerId===joy.id){ joy.active=false; joy.id=null; joy.x=0;joy.y=0; knob.style.transform='translate(-50%,-50%)'; } }
joyEl.addEventListener('pointerup',joyEnd); joyEl.addEventListener('pointercancel',joyEnd);

// camera orbit by dragging anywhere except UI — fully unrestricted (straight up/down allowed)
let camYaw=Math.PI, camPitch=0.32, dragging=false, lastX=0,lastY=0, dragId=null;
let tapDownX=0, tapDownY=0, tapDownT=0, tapMoved=false;
addEventListener('pointerdown',e=>{ ensureAudio(); if(e.target.closest('#joystick,#combat-cluster,#settings-panel,#char-panel,#fly-alt,#settings-btn,#fs-btn,#char-btn,.qbtns,.seg,button'))return; dragging=true; dragId=e.pointerId; lastX=e.clientX; lastY=e.clientY; tapDownX=e.clientX; tapDownY=e.clientY; tapDownT=performance.now(); tapMoved=false; },{passive:true});
addEventListener('pointermove',e=>{ if(!dragging||e.pointerId!==dragId)return; const dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
  if(Math.hypot(e.clientX-tapDownX,e.clientY-tapDownY)>10) tapMoved=true;
  camYaw-=dx*0.005*Settings.sensitivity; camPitch+=dy*0.0045*Settings.sensitivity;
  camPitch=THREE.MathUtils.clamp(camPitch,-1.55,1.55); },{passive:true});
addEventListener('pointerup',e=>{ if(e.pointerId===dragId){dragging=false;dragId=null;
  // tap (not drag) on open space: try manual target lock, never disturbs camera
  if(!tapMoved && performance.now()-tapDownT<350) tryTapLock(e.clientX,e.clientY);
} });
/* Manual target lock: tap a dummy to prioritize it for ~2.5s. Aim assist keeps
   validating range/alive state; manual aim is never overridden permanently. */
let manualLock=null, manualLockUntil=0;
const _tapNdc=new THREE.Vector2(), _tapPt=new THREE.Vector3();
function tryTapLock(px,py){
  if(!Settings.aimAssist){ toast('ENABLE AIM ASSIST TO LOCK'); return; }
  _tapNdc.set((px/innerWidth)*2-1, -((py/innerHeight)*2-1));
  aimRaycaster.setFromCamera(_tapNdc,camera);
  const ray=aimRaycaster.ray;
  let best=null, bestD=2.0;
  for(const t of targets){
    if(!t.alive) continue;
    const c=t.rig.group.position.clone(); c.y=1.3;
    const toC=c.clone().sub(ray.origin); const proj=toC.dot(ray.direction);
    if(proj<1||proj>MAX_DIST) continue;
    const perp=ray.origin.clone().addScaledVector(ray.direction,proj).distanceTo(c);
    if(perp<bestD){
      // never tap-lock through cover — keeps manual aim honest
      try{ if(typeof losBlocked==='function' && losBlocked(camera.position,c)) continue; }catch(e){}
      bestD=perp; best=t;
    }
  }
  if(best){ manualLock=best; manualLockUntil=performance.now()+2500; SFX.ui(); }
}
/* Desktop validation keys: WASD move (when stick idle), Space jump, F fly toggle.
   Mobile touch is untouched — keys only merge in when the joystick is idle. */
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='w'||k==='arrowup') keys.w=true;
  else if(k==='a'||k==='arrowleft') keys.a=true;
  else if(k==='s'||k==='arrowdown') keys.s=true;
  else if(k==='d'||k==='arrowright') keys.d=true;
  else if(k==='e') keys.e=true;
  else if(k==='q') keys.q=true;
  else if(k===' '){ e.preventDefault(); ensureAudio(); tryJump(); }
  else if(k==='f'){ ensureAudio(); player.flying?endFlight(true):startFlight(); }
});
addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  if(k==='w'||k==='arrowup') keys.w=false;
  else if(k==='a'||k==='arrowleft') keys.a=false;
  else if(k==='s'||k==='arrowdown') keys.s=false;
  else if(k==='d'||k==='arrowright') keys.d=false;
  else if(k==='e') keys.e=false;
  else if(k==='q') keys.q=false;
});
addEventListener('wheel',e=>{ camDist=THREE.MathUtils.clamp(camDist+e.deltaY*0.01,4,10); },{passive:true});
let camDist=6.2;
camera.position.set(player.pos.x - Math.sin(camYaw)*Math.cos(camPitch)*camDist, 1.7+Math.sin(camPitch)*camDist+0.6, player.pos.z - Math.cos(camYaw)*Math.cos(camPitch)*camDist);
camera.lookAt(player.pos.x,2.0,player.pos.z);

/* camera effects controller: ONE owner of combat camera offsets.
   Shake (random) + kick (directional dolly, never rotates view so aim stays
   precise) are combined here, decayed safely, and applied AFTER collision so
   effects can never push the camera through floor/walls. All gated by the
   camera-shake setting. */
let shakeAmp=0, shakeT=0;
let kickAmt=0; // decaying dolly offset along view dir (positive = pull back)
function triggerShake(amp,dur){ if(!Settings.shake) return; shakeAmp=Math.max(shakeAmp,amp); shakeT=Math.max(shakeT,dur); }
function camKick(strength){ if(!Settings.shake) return; kickAmt=Math.min(0.55,kickAmt+strength); }
function hitVignette(){ const v=document.getElementById('hit-vignette'); v.style.opacity='1'; setTimeout(()=>v.style.opacity='0',130); }
/* hit-stop: momentary world slowdown on impacts. Input + camera keep real dt. */
let hitStopT=0;
let _wasStopped=false;
function hitStop(dur){ hitStopT=Math.max(hitStopT,dur); }
/* restrained per-power screen pulses (short, readable, quality-gated) */
let flashPeak=0, flashT=0, flashDur=0.2, flashRGB='255,255,255', _flashEl=null;
const flashEl=()=>_flashEl||(_flashEl=document.getElementById('power-flash'));
function screenPulse(rgb,peak=0.2,dur=0.25){
  if(Settings.quality==='low') peak*=0.6;
  flashRGB=rgb; flashPeak=Math.max(flashPeak,peak); flashT=Math.max(flashT,dur); flashDur=Math.max(flashDur,dur);
}
function updateScreenFlash(dt){
  const el=flashEl(); if(!el) return;
  if(flashT>0){ flashT-=dt; const k=Math.max(0,flashT/flashDur);
    el.style.background=`radial-gradient(ellipse at center, transparent 55%, rgba(${flashRGB},${(flashPeak*k).toFixed(3)}) 100%)`;
    el.style.opacity='1';
    if(flashT<=0){ el.style.opacity='0'; flashPeak=0; }
  } else if(el.style.opacity!=='0'){ el.style.opacity='0'; }
}

/* ============ IRON MAN ABILITIES ============ */
function requireIronman(){ if(Settings.character!=='ironman'){ toast('SELECT IRONMAN FIRST'); openCharPanel(true); return false; } return true; }
function cancelOthers(except){
  if(except!=='spin' && AB.spin.t>0) endSpin(true);
  if(except!=='laser' && (AB.laser.t>0||AB.laser.holding)) endLaser(true);

}
function palmWorld(hand){ const v=new THREE.Vector3(); hand.getWorldPosition(v); return v; }
// --- short beam flashes (repulsor) ---
const beamGeoUnit=new THREE.CylinderGeometry(1,1,1,8,1,true);
function spawnBeam(from,to,color=0x9fe8ff,life=0.14,width=0.09){
  const len=from.distanceTo(to);
  if(len<0.05) return;
  const m=new THREE.Mesh(beamGeoUnit,new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.85,blending:THREE.AdditiveBlending,depthWrite:false}));
  m.scale.set(width*Q().beamWidth,len,width*Q().beamWidth);
  m.position.copy(from).add(to).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),to.clone().sub(from).normalize());
  scene.add(m); fadeBeams.push({m,life,max:life});
}
function updateBeams(dt){
  for(let i=fadeBeams.length-1;i>=0;i--){ const b=fadeBeams[i]; b.life-=dt;
    if(b.life<=0){ scene.remove(b.m); b.m.material.dispose(); fadeBeams.splice(i,1); continue; }
    b.m.material.opacity=0.85*(b.life/b.max);
  }
}
// --- ABILITY 1: double-hand repulsor spin ---

function updateSpin(dt){

  AB.spin.burst-=dt; AB.spin.tick-=dt;
  // faint rotational-momentum pulse, never obscuring aim

function bez(p0,p1,p2,t,out){ const a=1-t; out.set(0,0,0).addScaledVector(p0,a*a).addScaledVector(p1,2*a*t).addScaledVector(p2,t*t); return out; }

function laserEndpoint(origin,dir){
  const maxRange=laserRange();
  let best=maxRange;
  // walls + live test structures block (precomputed static + obstacle boxes)
  obstacleBoxes(_occBoxes);
  for(const box of _occBoxes){
    _lray.set(origin,dir);
    if(_lray.intersectBox(box,_hitP)){ const d=_hitP.distanceTo(origin); if(d<best) best=d; }
  }
  // floor blocks
  if(dir.y<-0.001){ const t=-origin.y/dir.y; if(t>0&&t<best) best=t; }
  return {point:origin.clone().addScaledVector(dir,best), dist:best};
}
function updateLaser(dt){

function updateFlight(dt){

  AB.fly.t-=dt;

  // GENUINE COMBAT FLIGHT: camera-relative strafe + forward/back, stable hover,
  // damped climb/descent. Basic missiles + volley stay usable in air (aerial
  // positioning payoff); spin/laser land first for a clean stance transition.
  let jx=joy.x, jy=joy.y;
  if(Math.hypot(jx,jy)<0.15 && (keys.w||keys.a||keys.s||keys.d)){ jx=(keys.d?1:0)-(keys.a?1:0); jy=(keys.s?1:0)-(keys.w?1:0); }

    const fwd=new THREE.Vector3(Math.sin(camYaw),0,Math.cos(camYaw));
    const right=new THREE.Vector3(-fwd.z,0,fwd.x);
    _move.addScaledVector(fwd,-jy).addScaledVector(right,jx);

  player.fvel.z=THREE.MathUtils.damp(player.fvel.z,_move.z,8,dt);

  const fspd=Math.hypot(player.fvel.x,player.fvel.z);

  // otherwise face travel direction. Never snaps.
  const hasLockF=(typeof lockedTarget!=='undefined' && lockedTarget && lockedTarget.alive);
  if(hasLockF && (mv>0.15 || AB.laser.holding)){
    const tp=lockedTarget.rig.group.position;

    let dd=ty-player.yaw; while(dd>Math.PI)dd-=Math.PI*2; while(dd<-Math.PI)dd+=Math.PI*2;
    player.yaw+=dd*Math.min(1,dt*10);

    const ty=Math.atan2(player.fvel.x,player.fvel.z);
    let dd=ty-player.yaw; while(dd>Math.PI)dd-=Math.PI*2; while(dd<-Math.PI)dd+=Math.PI*2;

  // propulsion from both hands + both feet, synced to flight

  const fl=new THREE.Vector3(), fr=new THREE.Vector3();
  playerRig.legL.ft.getWorldPosition(fl); playerRig.legR.ft.getWorldPosition(fr);

let lockedTarget=null;
const lockEl=document.getElementById('lock-marker');
const MAX_ANGLE_DEG=12, MAX_DIST=70;
const _losRay=new THREE.Raycaster();
function losBlocked(from,to){

  // so indicators never claim a target you cannot actually hit.
  _losRay.set(from,to.clone().sub(from).normalize());
  _losRay.far=from.distanceTo(to)-0.6;

}
function updateAimAssist(){

  // priority, not nearest-target). Near-equal angles prefer nearer target.
  let best=null,bestAngle=THREE.MathUtils.degToRad(MAX_ANGLE_DEG),bestDist=1e9;
  for(const t of targets){ if(!t.alive) continue;
    const tp=t.rig.group.position.clone(); tp.y=1.4;
    const toT=tp.sub(camera.position); const dist=toT.length(); if(dist>MAX_DIST) continue;
    toT.normalize(); const ang=aimDir.angleTo(toT);
    if(ang<bestAngle-0.026 || (Math.abs(ang-bestAngle)<0.026 && dist<bestDist)){
      // LoS gate at acquisition: never lock through cover
      const wp=t.rig.group.position.clone(); wp.y=1.4;
      if(losBlocked(camera.position,wp)) continue;
      bestAngle=ang; best=t; bestDist=dist;
    }
  }
  // keep current lock if still valid & within slightly larger angle (hysteresis)
  if(lockedTarget && (!lockedTarget.alive || !targets.includes(lockedTarget))){ clearLock(); }
  // manual tap-lock wins while fresh: prioritize the tapped target, keep validating LoS + range
  if(manualLock && performance.now()<manualLockUntil && manualLock.alive && targets.includes(manualLock)){
    const mp=manualLock.rig.group.position.clone(); mp.y=1.4;
    if(mp.distanceTo(camera.position)<MAX_DIST && !losBlocked(camera.position,mp)){
      if(lockedTarget!==manualLock){ lockedTarget=manualLock; SFX.lockOn(); }
      else lockedTarget=manualLock;
    }
    else manualLock=null;
  } else { if(manualLock && performance.now()>=manualLockUntil) manualLock=null;
    if(best){
      // STICKINESS: keep the current lock unless the challenger is clearly
      // closer to the crosshair (3° margin) — stops flicker between two dummies.
      if(lockedTarget && lockedTarget.alive && lockedTarget!==best){
        const lp=lockedTarget.rig.group.position.clone(); lp.y=1.4;
        const lto=lp.sub(camera.position); const ldist=lto.length();
        const lang=aimDir.angleTo(lto.normalize());
        const lockOk=ldist<MAX_DIST && lang<THREE.MathUtils.degToRad(MAX_ANGLE_DEG+6) && !losBlocked(camera.position,lockedTarget.rig.group.position.clone().setY(1.4));
        if(lockOk && bestAngle>lang-THREE.MathUtils.degToRad(3)){ best=null; }
      }
      if(best){

      }
    }
    else if(lockedTarget){ // validate still in range + LoS
    const tp=lockedTarget.rig.group.position.clone(); tp.y=1.4;
    const toT=tp.sub(camera.position); if(toT.length()>MAX_DIST||!lockedTarget.alive) clearLock();
    else { const ang=aimDir.angleTo(toT.normalize()); if(ang>THREE.MathUtils.degToRad(MAX_ANGLE_DEG+6)) clearLock(); else if(losBlocked(camera.position,lockedTarget.rig.group.position.clone().setY(1.4))) clearLock(); }

      const d=camera.position.distanceTo(wp);

      lockEl.style.transform=`scale(${sc.toFixed(3)})`; lockEl.style.transformOrigin='center';
    }
    else lockEl.style.display='none';
  } else lockEl.style.display='none';
}
function clearLock(){ lockedTarget=null; lockEl.style.display='none'; }

/* ============ PLAYER ANIMATION CONTROLLER ============
   Layered priorities: base locomotion (idle/walk) → aim (spine+casting arm) →
   action overlays (attack timeline, volley, laser, spin, flight). Each layer
   only writes its own joints; every joint is damped toward its target, so no
   snapping, twisting, or stuck poses. R6's locked mid-joints are never driven

  dampAxis(arm.sh,'x',tx*boost,14,dt);
  dampAxis(arm.sh,'z',tz,10,dt);
  dampAxis(arm.el,'x',r.caps.elbows?te:0,14,dt);

function solveLeg(r,leg,tx,tk,tf,dt){
  dampAxis(leg.hp,'x',tx,14,dt);
  dampAxis(leg.kn,'x',r.caps.knees?tk:0,14,dt);

const _mvF=new THREE.Vector3(), _mvR=new THREE.Vector3(), _move=new THREE.Vector3();

/* ============ PLAYER ANIMATION CONTROLLER ============

     • animatePlayer        — locomotion integration + procedural posing

   air), each weight damped so every transition cross-fades instead of
   snapping. R6's mid-joints stay locked via rig.caps; R15 uses full
   articulation. After posing, foot planting compensates root height so the
   lower foot never floats or sinks while grounded. */
function groundControl(dt){
  const lasing=AB.laser.holding;
  const spinning=AB.spin.t>0;
  const accel=player.grounded?14:8; // snappy ground response, lighter air control
  const moveScale=player.grounded?1:0.72;
  // Keyboard override (desktop validation) merges with joystick when stick idle
  const kx=(keys.d?1:0)-(keys.a?1:0), ky=(keys.s?1:0)-(keys.w?1:0);
  let jx=joy.x, jy=joy.y;
  if(Math.hypot(jx,jy)<0.15 && (kx||ky)){ jx=kx; jy=ky; }
  _move.set(0,0,0);
  if(player.moving){
    const cy=Math.cos(camYaw), sy=Math.sin(camYaw);
    _mvF.set(sy,0,cy);
    if(_mvF.lengthSq()<1e-4) _mvF.set(Math.sin(player.yaw),0,Math.cos(player.yaw));
    _mvF.normalize();
    _mvR.set(-_mvF.z,0,_mvF.x);
    _move.addScaledVector(_mvF,-jy).addScaledVector(_mvR,jx);
    if(_move.lengthSq()>1) _move.normalize();

  player.vel.z=THREE.MathUtils.damp(player.vel.z,_move.z,accel,dt);
  player.pos.addScaledVector(player.vel,dt);
  clampToArena(player.pos,1.5);

  const spd=player.vel.length();
  // STRAFE AIM-FACING (Marvel-Rivals feel): while firing the beam, mid-attack,
  // or strafing with a live lock, face the aim — never the movement direction.
  // Otherwise face travel direction. Spin owns the whole body so it is excluded.
  const hasLock=(typeof lockedTarget!=='undefined' && lockedTarget && lockedTarget.alive);
  const strafing=!spinning && (lasing || player.atkT>0 || (hasLock && player.moving));
  if(strafing){
    let targetYaw=camYaw;
    if(hasLock){ const tp=lockedTarget.rig.group.position; targetYaw=Math.atan2(tp.x-player.pos.x,tp.z-player.pos.z); }
    let d=targetYaw-player.yaw; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2;

      g.position.y=THREE.MathUtils.damp(g.position.y,0.25,6,dt);
      continue;
    }
    // brief ragdoll tumble (stage-3 blast): recovers safely, never breaks respawn
    if(t.ragdollT>0){
      t.ragdollT-=dt;
      g.rotation.z=THREE.MathUtils.damp(g.rotation.z,0.9,4,dt);
      g.rotation.x=THREE.MathUtils.damp(g.rotation.x,-0.5,4,dt);
      g.position.y=Math.max(g.position.y,0.35+t.ragdollT*0.5);
      if(t.ragdollT<=0){ g.rotation.z=0; g.rotation.x=0; }
      t.hb.grp.lookAt(camera.position);
      continue;
    }
    // idle sway (upper body only — legs are root-fixed so feet stay planted)
    t.rig.hips.position.y=THREE.MathUtils.damp(t.rig.hips.position.y,HIP_H+Math.sin(time*2+g.position.x)*0.02,8,dt);
    t.rig.armL.sh.rotation.x=Math.sin(time*1.8+g.position.z)*0.07;
    t.rig.armR.sh.rotation.x=-Math.sin(time*1.8+g.position.z)*0.07;
    t.rig.armL.el.rotation.x=-0.35; t.rig.armR.el.rotation.x=-0.35;
    // hit flash decay, fully reset emissive at the end
    if(t.flash>0){
      t.flash=Math.max(0,t.flash-dt*4);
      const f=t.flash;
      t.rig.group.traverse(o=>{ if(o.isMesh&&o.material.emissive!==undefined){ if(f<=0){ o.material.emissive.setRGB(0,0,0); o.material.emissiveIntensity=0; } else { o.material.emissive.setRGB(f*0.9,f*0.08,f*0.08); o.material.emissiveIntensity=f; } } });
    }
    // recoil: lean back quickly, then ease back to standing
    if(t.recoil>0){ t.recoil=Math.max(0,t.recoil-dt*2.2); }
    g.rotation.x=THREE.MathUtils.damp(g.rotation.x,-t.recoil*0.45,18,dt);
    g.position.y=THREE.MathUtils.damp(g.position.y,t.recoil*0.15,18,dt);
    // healthbar billboard (true world-space facing, compensates parent lean)
    t.hb.grp.lookAt(camera.position);
  }
}

/* ============ CAMERA (free-look + floor/wall collision) ============ */
let smoothCamDist=6.2;
const _camDir=new THREE.Vector3(), _camWant=new THREE.Vector3(), _camPivot=new THREE.Vector3(), _camHit=new THREE.Vector3();
const _camRay=new THREE.Raycaster();
function updateCamera(dt){
  const px=player.pos.x, py=1.7+player.flyH, pz=player.pos.z;
  // AERIAL FRAMING: rise + pull back slightly with altitude so dives, hover
  // strafes and volley arcs stay readable. Ground framing is untouched.
  const altK=THREE.MathUtils.clamp(player.flyH/FLY_MAX_H,0,1);
  const frameDist=camDist+altK*1.4;
  _camPivot.set(px,py+0.3+altK*0.5,pz);
  const cx=px - Math.sin(camYaw)*Math.cos(camPitch)*frameDist;
  const cz=pz - Math.cos(camYaw)*Math.cos(camPitch)*frameDist;
  const cy=py + Math.sin(camPitch)*frameDist + 0.6;
  _camWant.set(cx,cy,cz);
  // collision: pull in when floor or curb blocks the view (never clip through)
  _camDir.copy(_camWant).sub(_camPivot);
  let wantDist=_camDir.length();
  _camDir.normalize();
  let blockedDist=wantDist;
  _camRay.set(_camPivot,_camDir); _camRay.far=wantDist;
  const hits=_camRay.intersectObjects(camOccluders,false);
  if(hits.length) blockedDist=Math.min(blockedDist,hits[0].distance-0.4);
  // floor plane: keep camera above ground
  if(_camDir.y<-0.001){
    const t=(0.45-_camPivot.y)/_camDir.y;
    if(t>0&&t<blockedDist) blockedDist=t;
  }
  blockedDist=Math.max(1.4,Math.min(wantDist,blockedDist));
  smoothCamDist=THREE.MathUtils.damp(smoothCamDist,blockedDist,10,dt);
  camera.position.copy(_camPivot).addScaledVector(_camDir,smoothCamDist);
  if(camera.position.y<0.4) camera.position.y=0.4;
  // combat feedback offsets (shake + directional kick), applied post-collision
  let sx=0,sy=0;
  if(shakeT>0){ shakeT-=dt; const s=shakeAmp*(shakeT>0?shakeT/0.22:0); sx=(Math.random()-0.5)*s; sy=(Math.random()-0.5)*s; if(shakeT<=0) shakeAmp=0; }
  if(kickAmt>0.001){ camera.position.addScaledVector(_camDir,kickAmt); kickAmt*=Math.exp(-9*dt); }
  else kickAmt=0;
  camera.position.x+=sx; camera.position.y+=sy;
  if(camera.position.y<0.35) camera.position.y=0.35;
  // hard safety: combat offsets can never leave the valid camera volume
  camera.position.x=THREE.MathUtils.clamp(camera.position.x,-ARENA/2-1,ARENA/2+1);
  camera.position.z=THREE.MathUtils.clamp(camera.position.z,-ARENA/2-1,ARENA/2+1);
  camera.lookAt(_camPivot);
}

/* ============ SETTINGS UI ============ */
const $=id=>document.getElementById(id);
function toast(msg){ const t=$('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',1400); }
/* Hitmarker + reticle pulse: immediate hit confirmation at the aim point.
   Light ticks flash the reticle; kills add the red X. Never blocks the view. */
function pulseHitmarker(kill=false){
  const h=$('hitmarker'); if(h){ h.classList.add('show'); h.classList.toggle('kill',!!kill);
    clearTimeout(h._h); h._h=setTimeout(()=>h.classList.remove('show'), kill?220:120); }
  const r=$('reticle'); if(r){ r.classList.add('hit'); clearTimeout(r._h); r._h=setTimeout(()=>r.classList.remove('hit'),110); }
}
$('settings-btn').onclick=()=>{ ensureAudio(); SFX.ui(); $('settings-panel').classList.toggle('open'); };
$('close-settings').onclick=()=>{ SFX.ui(); $('settings-panel').classList.remove('open'); };
$('s-targets').oninput=e=>{ const n=+e.target.value; Settings.targetCount=n; syncTargetCount(n); };
$('t-aim').onclick=e=>{ Settings.aimAssist=!Settings.aimAssist; e.target.classList.toggle('on',Settings.aimAssist); if(!Settings.aimAssist) clearLock(); SFX.ui(); };
$('s-sens').oninput=e=>{ Settings.sensitivity=+e.target.value; $('v-sens').textContent=(+e.target.value).toFixed(1); };
$('reset-sens').onclick=()=>{ Settings.sensitivity=DEFAULT_SENS; $('s-sens').value=DEFAULT_SENS; $('v-sens').textContent=DEFAULT_SENS.toFixed(1); SFX.ui(); toast('Sensitivity reset'); };
$('s-vol').oninput=e=>{ const v=+e.target.value/100; setVolume(v); $('v-vol').textContent=e.target.value+'%'; };
$('t-shake').onclick=e=>{ Settings.shake=!Settings.shake; e.target.classList.toggle('on',Settings.shake); SFX.ui(); };
document.querySelectorAll('.qbtns button').forEach(b=>b.onclick=()=>{ Settings.quality=b.dataset.q; applyQuality(); SFX.ui(); toast('Graphics: '+b.dataset.q.toUpperCase()); });
document.querySelectorAll('.seg.aimseg button').forEach(b=>b.onclick=()=>{ Settings.aimingMode=b.dataset.aim; document.querySelectorAll('.seg.aimseg button').forEach(x=>x.classList.toggle('active',x===b)); layoutReticle(); SFX.ui(); });
document.querySelectorAll('.seg.rigseg button').forEach(b=>b.onclick=()=>{ setRigType(b.dataset.rig); });
document.querySelectorAll('.seg.rigseg button').forEach(x=>x.classList.toggle('active',x.dataset.rig===Settings.rigType));
function updateCombatDisabled(){ // abilities need IRONMAN; attack always live
  const dis=Settings.character!=='ironman';
  abBtns.forEach(b=>b.classList.toggle('disabled',dis));
}
function openCharPanel(open){ const p=document.getElementById('char-panel'); if(open===undefined) p.classList.toggle('open'); else p.classList.toggle('open',!!open); }
$('char-btn').onclick=()=>{ ensureAudio(); SFX.ui(); const p=$('char-panel'); p.classList.toggle('open'); };
$('char-select').onclick=()=>{
  ensureAudio(); SFX.ui();
  Settings.character='ironman';
  respawnPlayer(); // safe respawn, same rig, camera + controls untouched
  updateCombatDisabled();
  $('char-select').textContent='✓ IRONMAN ACTIVE';
  $('char-select').classList.add('selected');
  $('char-panel').classList.remove('open');
  toast('IRONMAN READY');
};
function goFullscreen(){ ensureAudio(); const el=document.documentElement; try{ if(el.requestFullscreen) el.requestFullscreen(); }catch(e){} try{ if(screen.orientation&&screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{}); }catch(e){} }
$('fs-btn').onclick=goFullscreen;
document.getElementById('fs-btn2').onclick=goFullscreen;
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

/* ============ MAIN LOOP ============ */
applyQuality();
layoutReticle();
updateCombatDisabled();
setVolume(Settings.volume);
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;
  // hit-stop: world slows for an instant on heavy impacts; input+camera stay realtime
  const wdt=hitStopT>0?dt*0.2:dt;
  if(hitStopT>0){ hitStopT-=dt; setStopMix(true); } else if(_wasStopped){ setStopMix(false); _wasStopped=false; }
  if(hitStopT>0) _wasStopped=true;
  // combo idle reset keeps stage tracking consistent (never skips from stale state)
  if(player.combo!==0){ player.comboIdle+=dt; if(player.comboIdle>activeKit().combo.resetTime){ player.combo=0; player.comboIdle=0; } }
  // buffered attack: queued tap fires the moment recovery/cooldown clears
  if(atkBuffer>0){ atkBuffer-=dt; if(atkBuffer<=0){ atkBuffer=0; } else if(atkTimer<=0 && player.atkT<=0){ atkBuffer=0; atkTimer=activeKit().combo.cd; player.atkT=ATK_DUR; player.pendingShot=true; } }
  updatePlayerPhysics(dt);
  animatePlayer(wdt,t);
  animateTargets(wdt,t);
  updateRespawns(wdt);
  updateBurning(wdt,t);
  updateObstacles(wdt); // crate respawn timers
  updateCamera(dt);
  updateAimAssist();
  updateProjectiles(wdt);
  updateVolley(wdt);
  updateSpin(wdt);
  updateLaser(wdt);
  updateFlight(wdt);
  if(player.landing && !player.flying){ // touchdown glide after flight ends
    player.flyH=THREE.MathUtils.damp(player.flyH,0,6,wdt);
    if(player.flyH<0.05){ player.flyH=0; player.landing=false; SFX.touchdown(); camKick(0.08); }
  }
  updateBeams(wdt);
  if(boomLightT>0){ boomLightT-=wdt; if(boomLightT<=0) boomLight.intensity=0; }
  updateExplosions(wdt);
  updateCooldownUI(dt);
  updateDamageNumbers(wdt);
  updateScreenFlash(dt);
  renderer.render(scene,camera);
}
loop();
</script>
